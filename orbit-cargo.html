<!-- ==================================================
     JAVASCRIPT
     ================================================== -->

<script>
(() => {

	/* ==================================================
	   REMOVE INITIALIZATION ANTERIOR
	   ================================================== */

	if (window.__brunoDesktopMenuController) {
		window.__brunoDesktopMenuController.abort();
	}

	if (window.__brunoDesktopMenuObserver) {
		window.__brunoDesktopMenuObserver.disconnect();
	}


	const controller =
		new AbortController();

	const signal =
		controller.signal;


	window.__brunoDesktopMenuController =
		controller;



	/* ==================================================
	   MAPA PROJETO -> GLB

	   MOTION:
	   cada projeto possui seu próprio GLB.

	   VFX:
	   todos os projetos usam vfx.glb.
	   ================================================== */

	const ORBIT_PROJECT_MAP = {

		"/showreel": "showreel",
		"/playground": "playground",
		"/futster": "futster",
		"/gobelinsjpo": "gobelinsjpo",
		"/universal-music-france": "universal-music-france",
		"/museum-d'orsay": "museum-dorsay",
		"/paratypology": "paratypology",
		"/papersoundmachine": "papersoundmachine",
		"/bushoe": "bushoe",
		"/silent-running": "silent-running",

		"/vfx-showreel": "vfx",
		"/and-if-they-didnt-exist": "vfx",
		"/la-casa-di-barbi": "vfx",
		"/limbo": "vfx",
		"/over-the-burning-skies": "vfx",
		"/color-latium": "vfx",
		"/cannes": "vfx",
		"/relogio": "vfx"

	};



	/* ==================================================
	   HELPERS
	   ================================================== */

	function normalizePath(path) {

		return String(path || "")
			.replace(/\/+$/, "")
			.toLowerCase();

	}


	function getLinkPath(link) {

		return normalizePath(
			new URL(
				link.href,
				window.location.origin
			).pathname
		);

	}


	function getCurrentPath() {

		return normalizePath(
			window.location.pathname
		);

	}


	function getOrbitFrames() {

		return document.querySelectorAll(
			".portfolio-orbit iframe"
		);

	}



	/* ==================================================
	   PHASE 4 — PAGINA ATUAL -> HERO GLB
	   ==================================================

	   Home / outra pagina:
	   key = null -> orbita normal

	   Motion:
	   key = projeto -> GLB especifico vira hero

	   VFX:
	   qualquer projeto -> vfx.glb vira hero
	   ================================================== */

	function getCurrentProjectKey() {

		const path =
			getCurrentPath();

		return ORBIT_PROJECT_MAP[path] || null;

	}


	function sendCurrentProjectToOrbit() {

		const key =
			getCurrentProjectKey();


		getOrbitFrames()
			.forEach((frame) => {

				frame.contentWindow?.postMessage(
					{
						type:
							"bruno-orbit-project",

						key:
							key
					},
					"*"
				);

			});

	}


	function syncCurrentProjectToOrbit() {

		sendCurrentProjectToOrbit();

		/*
		 * Reenvios curtos ajudam quando o Cargo acabou
		 * de trocar a pagina ou o iframe terminou de carregar.
		 */
		setTimeout(
			sendCurrentProjectToOrbit,
			80
		);

		setTimeout(
			sendCurrentProjectToOrbit,
			300
		);

	}


	/* ==================================================
	   PHASE 4.1 — NAVEGACAO CARGO -> HERO IMEDIATO

	   O Cargo usa navegacao por history e nem sempre dispara
	   popstate quando um link de projeto e clicado.

	   Por isso enviamos o projeto DIRETAMENTE no clique,
	   antes mesmo da troca de pagina terminar.
	   ================================================== */

	function sendProjectKeyToOrbit(key) {

		getOrbitFrames()
			.forEach((frame) => {

				frame.contentWindow?.postMessage(
					{
						type:
							"bruno-orbit-project",

						key:
							key || null
					},
					"*"
				);

			});

	}


	document.addEventListener(
		"click",

		(event) => {

			const projectLink =
				event.target.closest(
					".portfolio-projects a"
				);


			if (projectLink) {

				const key =
					ORBIT_PROJECT_MAP[
						getLinkPath(projectLink)
					] || null;


				sendProjectKeyToOrbit(
					key
				);


				/*
				 * Reenvia depois que o Cargo termina
				 * sua navegacao interna.
				 */
				setTimeout(
					() => sendProjectKeyToOrbit(key),
					120
				);

				setTimeout(
					() => sendProjectKeyToOrbit(key),
					400
				);

				return;
			}


			/*
			 * BRUNO LOPES = home = volta para orbita normal.
			 */
			const homeLink =
				event.target.closest(
					".titlebrunolopes"
				);


			if (homeLink) {

				sendProjectKeyToOrbit(
					null
				);

			}

		},

		{
			capture: true,
			signal: signal
		}
	);



	/* ==================================================
	   DETECTA history.pushState / replaceState DO CARGO
	   ================================================== */

	if (!window.__brunoHistoryPatched) {

		window.__brunoHistoryPatched = true;


		["pushState", "replaceState"]
			.forEach((methodName) => {

				const original =
					history[methodName];


				history[methodName] =
					function(...args) {

						const result =
							original.apply(
								this,
								args
							);


						setTimeout(
							() => {

								window.dispatchEvent(
									new Event(
										"bruno-history-change"
									)
								);

							},
							0
						);


						return result;

					};

			});

	}


	window.addEventListener(
		"bruno-history-change",

		() => {

			syncCurrentProjectToOrbit();

		},

		{
			signal: signal
		}
	);



	/* ==================================================
	   ABRE / FECHA MENU
	   ================================================== */

	function openMenu(category) {

		const lists =
			document.querySelectorAll(
				"[data-menu-list]"
			);

		const buttons =
			document.querySelectorAll(
				"[data-menu-button]"
			);


		lists.forEach((list) => {

			list.classList.toggle(
				"is-open",
				list.dataset.menuList === category
			);

		});


		buttons.forEach((button) => {

			button.classList.toggle(
				"is-active",
				button.dataset.menuButton === category
			);

		});


		if (category) {

			sessionStorage.setItem(
				"bruno-portfolio-menu",
				category
			);

		} else {

			sessionStorage.removeItem(
				"bruno-portfolio-menu"
			);

		}

	}



	/* ==================================================
	   CLIQUE — MOTION / VFX
	   ================================================== */

	document.addEventListener(
		"click",

		(event) => {

			const button =
				event.target.closest(
					"[data-menu-button]"
				);


			if (!button) {
				return;
			}


			event.preventDefault();
			event.stopPropagation();


			const category =
				button.dataset.menuButton;


			/*
			 * Clicar em MOTION GRAPHICS ou VFX
			 * volta o 3D para a órbita normal.
			 *
			 * Isso limpa o HERO do projeto atual
			 * sem navegar para outra página.
			 */
			sendProjectKeyToOrbit(
				null
			);


			const list =
				document.querySelector(
					`[data-menu-list="${category}"]`
				);


			if (!list) {
				return;
			}


			const alreadyOpen =
				list.classList.contains(
					"is-open"
				);


			openMenu(
				alreadyOpen
					? null
					: category
			);

		},

		{
			capture: true,
			signal: signal
		}
	);



	/* ==================================================
	   RESTAURA ULTIMO MENU
	   ================================================== */

	function restoreSavedMenu() {

		const savedMenu =
			sessionStorage.getItem(
				"bruno-portfolio-menu"
			);


		if (
			savedMenu !== "motion" &&
			savedMenu !== "vfx"
		) {
			return;
		}


		const list =
			document.querySelector(
				`[data-menu-list="${savedMenu}"]`
			);


		if (!list) {
			return;
		}


		if (
			!list.classList.contains(
				"is-open"
			)
		) {

			openMenu(savedMenu);

		}

	}



	/* ==================================================
	   PROJETO ATUAL EM NEGRITO
	   ================================================== */

	function updateCurrentProject() {

		const projectLinks =
			document.querySelectorAll(
				".portfolio-projects a"
			);


		const currentPath =
			getCurrentPath();


		projectLinks.forEach((link) => {

			const linkPath =
				getLinkPath(link);


			link.classList.toggle(
				"is-current",
				linkPath === currentPath
			);

		});

	}



	/* ==================================================
	   REFRESH DO MENU + HERO
	   ================================================== */

	let refreshQueued = false;


	function refreshMenu() {

		if (refreshQueued) {
			return;
		}


		refreshQueued = true;


		requestAnimationFrame(() => {

			refreshQueued = false;

			updateCurrentProject();

			restoreSavedMenu();

			syncCurrentProjectToOrbit();

		});

	}



	/* ==================================================
	   PRIMEIRA EXECUCAO
	   ================================================== */

	updateCurrentProject();

	restoreSavedMenu();

	syncCurrentProjectToOrbit();



	/* ==================================================
	   QUANDO OS IFRAMES CARREGAREM
	   ================================================== */

	getOrbitFrames()
		.forEach((frame) => {

			frame.addEventListener(
				"load",
				() => {

					syncCurrentProjectToOrbit();

				},
				{
					signal: signal
				}
			);

		});



	/* ==================================================
	   OBSERVA NAVEGACAO DO CARGO
	   ================================================== */

	const observer =
		new MutationObserver(() => {

			refreshMenu();

		});


	observer.observe(
		document.body,
		{
			childList: true,
			subtree: true
		}
	);


	window.__brunoDesktopMenuObserver =
		observer;



	/* ==================================================
	   VOLTAR / AVANCAR
	   ================================================== */

	window.addEventListener(
		"popstate",

		() => {

			setTimeout(
				refreshMenu,
				50
			);

		},

		{
			signal: signal
		}
	);



	/* ==================================================
	   CARGO -> ORBIT
	   POSICAO DO MOUSE
	   ================================================== */

	function sendPointerToOrbit(event) {

		const frames =
			getOrbitFrames();


		frames.forEach((frame) => {

			if (!frame.contentWindow) {
				return;
			}


			const rect =
				frame.getBoundingClientRect();


			const x =
				(event.clientX - rect.left) /
				rect.width;


			const y =
				(event.clientY - rect.top) /
				rect.height;


			frame.contentWindow.postMessage(
				{
					type:
						"bruno-orbit-pointer",

					active:
						true,

					x:
						x,

					y:
						y
				},
				"*"
			);

		});

	}


	document.addEventListener(
		"pointermove",
		sendPointerToOrbit,
		{
			passive: true,
			capture: true,
			signal: signal
		}
	);



	/* ==================================================
	   TITULO -> GLB
	   ================================================== */

	function sendOrbitHighlight(key) {

		getOrbitFrames()
			.forEach((frame) => {

				frame.contentWindow?.postMessage(
					{
						type:
							"bruno-orbit-highlight",

						key:
							key
					},
					"*"
				);

			});

	}


	document.addEventListener(
		"pointerover",

		(event) => {

			const link =
				event.target.closest(
					".portfolio-projects a"
				);


			if (link) {

				const key =
					ORBIT_PROJECT_MAP[
						getLinkPath(link)
					];


				if (key) {

					sendOrbitHighlight(
						key
					);

				}


				return;
			}


			const vfxButton =
				event.target.closest(
					'[data-menu-button="vfx"]'
				);


			if (vfxButton) {

				sendOrbitHighlight(
					"vfx"
				);

			}

		},

		{
			signal: signal
		}
	);


	document.addEventListener(
		"pointerout",

		(event) => {

			const link =
				event.target.closest(
					".portfolio-projects a"
				);


			if (link) {

				sendOrbitHighlight(
					null
				);

				return;
			}


			const vfxButton =
				event.target.closest(
					'[data-menu-button="vfx"]'
				);


			if (vfxButton) {

				sendOrbitHighlight(
					null
				);

			}

		},

		{
			signal: signal
		}
	);



	/* ==================================================
	   GLB -> TITULO
	   ================================================== */

	const orbitLayerHover = {

		front:
			null,

		back:
			null,

		all:
			null

	};


	function clearOrbitTextHighlight() {

		document
			.querySelectorAll(
				".is-orbit-hovered"
			)
			.forEach((element) => {

				element.classList.remove(
					"is-orbit-hovered"
				);

			});

	}


	window.addEventListener(
		"message",

		(event) => {

			const data =
				event.data;


			if (
				!data ||
				data.type !==
					"bruno-orbit-hover"
			) {
				return;
			}


			const layer =
				data.layer || "all";


			orbitLayerHover[layer] =
				data.key || null;


			const activeKey =
				orbitLayerHover.front ||
				orbitLayerHover.back ||
				orbitLayerHover.all;


			clearOrbitTextHighlight();


			if (!activeKey) {
				return;
			}


			if (activeKey === "vfx") {

				document
					.querySelector(
						'[data-menu-button="vfx"]'
					)
					?.classList.add(
						"is-orbit-hovered"
					);

				return;
			}


			document
				.querySelectorAll(
					".portfolio-projects a"
				)
				.forEach((link) => {

					const key =
						ORBIT_PROJECT_MAP[
							getLinkPath(link)
						];


					if (
						key === activeKey
					) {

						link.classList.add(
							"is-orbit-hovered"
						);

					}

				});

		},

		{
			signal: signal
		}
	);



	/* ==================================================
	   LIMPA HOVER
	   ================================================== */

	function clearOrbitHover() {

		sendOrbitHighlight(
			null
		);


		orbitLayerHover.front =
			null;

		orbitLayerHover.back =
			null;

		orbitLayerHover.all =
			null;


		clearOrbitTextHighlight();


		getOrbitFrames()
			.forEach((frame) => {

				frame.contentWindow?.postMessage(
					{
						type:
							"bruno-orbit-pointer",

						active:
							false
					},
					"*"
				);

			});

	}


	document.addEventListener(
		"mouseleave",
		clearOrbitHover,
		{
			signal: signal
		}
	);


	window.addEventListener(
		"blur",
		clearOrbitHover,
		{
			signal: signal
		}
	);

})();
</script>
