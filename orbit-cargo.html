<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruno Lopes — Cargo Orbit</title>

<style>
html, body {
	margin: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: transparent;
}

body {
	position: relative;
}

#orbit {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: transparent;
}

#orbit canvas {
	position: absolute;
	inset: 0;
	display: block;
	width: 100%;
	height: 100%;
	background: transparent;
	cursor: default;
}

#status {
	position: fixed;
	left: 8px;
	bottom: 8px;
	z-index: 20;
	max-width: calc(100% - 16px);
	box-sizing: border-box;
	padding: 5px 7px;
	border-radius: 4px;
	background: rgba(0,0,0,.82);
	color: #fff;
	font: 11px/1.3 Arial, sans-serif;
	pointer-events: none;
	display: none;
	white-space: pre-wrap;
}
</style>

<script>
(() => {
	const params = new URLSearchParams(location.search);
	const debug = params.get("debug") === "1";

	function showStatus(message) {
		const el = document.getElementById("status");
		if (!el) return;
		el.style.display = "block";
		el.textContent = message;
	}

	window.__orbitDebug = { debug, showStatus };

	if (debug) {
		window.addEventListener("error", (event) => {
			showStatus("JS ERROR:\n" + (event.message || "Unknown error"));
		});

		window.addEventListener("unhandledrejection", (event) => {
			const reason = event.reason;
			showStatus(
				"PROMISE ERROR:\n" +
				(reason?.message || String(reason || "Unknown error"))
			);
		});
	}
})();
</script>

<script type="importmap">
{
	"imports": {
		"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
		"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
	}
}
</script>
</head>

<body>
<div id="orbit"></div>
<div id="status">Loading…</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const stage = document.getElementById("orbit");
const status = document.getElementById("status");
const DEBUG = window.__orbitDebug?.debug === true;

function report(message, force = false) {
	if (!DEBUG && !force) return;
	status.style.display = "block";
	status.textContent = message;
}

/* ==================================================
   FINAL SELECTED OBJECTS
   ================================================== */

const ITEMS = [
	{
		file: "Showreel.glb",
		scale: 1.10,
		tilt: [18, -30, 32]
	},
	{
		file: "Playground2.glb",
		scale: 1.05,
		tilt: [14, -16, 4]
	},
	{
		file: "Futster.glb",
		scale: 0.60,
		tilt: [-26, 90, 2]
	},
	{
		file: "GobelinsJPO2.glb",
		scale: 0.80,
		tilt: [-10, -24, -4]
	},
	{
		file: "UniversalMusicFrance.glb",
		scale: 1.30,
		tilt: [10, -20, -12]
	},
	{
		file: "MuseumDOrsay.glb",
		scale: 1.10,
		tilt: [-16, 0, 0]
	},
	{
		file: "PaperSoundMachine2.glb",
		scale: 0.80,
		tilt: [-34, 0, -44]
	},
	{
		file: "Bushoe.glb",
		scale: 1.60,
		tilt: [-20, -34, -32]
	},
	{
		file: "SilentRunning2.glb",
		scale: 0.95,
		tilt: [8, 0, 0]
	},
	{
		file: "Paratypology.glb",
		scale: 1.25,
		tilt: [12, 90, 12]
	},
	{
		file: "vfx.glb",
		scale: 0.75,
		tilt: [8, -90, 12]
	}
];


/* ==================================================
   SAVED LOOK / ORBIT
   ================================================== */

const SETTINGS = {
	objectSize: 0.70,

	ringWidth: 2.80,
	ringHeight: 0.70,
	ringDepth: 0.30,

	ringTiltX: 0,
	ringTiltY: -21,
	ringTiltZ: -23,

	speed: 0.31,
	overlap: 0.31,
	depthScale: 1.45,

	saturation: 1.85,
	contrast: 1.05,
	brightness: 1.20,

	hoverBoost: 1.60,
	hoverSpin: 1.20
};


/* ==================================================
   THREE
   ================================================== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
	34,
	1,
	0.01,
	100
);

camera.position.set(0, 0, 7.4);

const renderer = new THREE.WebGLRenderer({
	antialias: true,
	alpha: true,
	powerPreference: "high-performance"
});

renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.filter =
	`saturate(${SETTINGS.saturation}) ` +
	`contrast(${SETTINGS.contrast}) ` +
	`brightness(${SETTINGS.brightness})`;

stage.appendChild(renderer.domElement);


/* ==================================================
   LIGHTING
   ================================================== */

scene.add(
	new THREE.HemisphereLight(
		0xffffff,
		0x706b72,
		1.25
	)
);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.5, 4, 5);
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfc9ff, 0.38);
fill.position.set(-4, -1, 3);
scene.add(fill);


/* ==================================================
   MODEL HELPERS
   ================================================== */

const wrappers = [];
const hoverTargets = [];

function normalizeModel(root, index) {
	root.updateMatrixWorld(true);

	const box = new THREE.Box3().setFromObject(root);
	const center = new THREE.Vector3();
	const size = new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	const maxDim = Math.max(size.x, size.y, size.z, 0.0001);

	root.position.sub(center);
	root.scale.setScalar(1 / maxDim);

	root.traverse((child) => {
		if (!child.isMesh) return;

		child.userData.itemIndex = index;

		if (Array.isArray(child.material)) {
			child.material = child.material.map((material) => {
				const clone = material.clone();
				clone.transparent = true;
				clone.opacity = 1;
				return clone;
			});
		} else if (child.material) {
			child.material = child.material.clone();
			child.material.transparent = true;
			child.material.opacity = 1;
		}
	});

	return root;
}

function createWrapper(root, index) {
	const item = ITEMS[index];
	const wrapper = new THREE.Group();

	wrapper.userData.itemIndex = index;
	wrapper.userData.baseAngle =
		(index / ITEMS.length) * Math.PI * 2 - Math.PI / 2;

	wrapper.userData.radiusX =
		1 + Math.sin(index * 2.17) * 0.065;

	wrapper.userData.radiusY =
		1 + Math.cos(index * 1.71) * 0.055;

	wrapper.userData.phase = index * 0.83;

	const [tx, ty, tz] = item.tilt;

	wrapper.userData.baseRotX =
		THREE.MathUtils.degToRad(-14 + (index % 4) * 9 + tx);

	wrapper.userData.baseRotY =
		THREE.MathUtils.degToRad(-28 + (index % 5) * 14 + ty);

	wrapper.userData.baseRotZ =
		THREE.MathUtils.degToRad(-8 + (index % 3) * 8 + tz);

	wrapper.userData.baseSize =
		[1.00, 1.08, 1.18, 0.92, 1.12, 1.02, 1.10, 0.96][index % 8];

	wrapper.userData.customScale = item.scale;
	wrapper.userData.hoverSpin = 0;
	wrapper.userData.spinVelocity = 0;

	const proxy = new THREE.Mesh(
		new THREE.SphereGeometry(0.82, 14, 10),
		new THREE.MeshBasicMaterial({
			transparent: true,
			opacity: 0,
			depthWrite: false,
			colorWrite: false
		})
	);

	proxy.userData.itemIndex = index;
	proxy.userData.isHoverProxy = true;

	wrapper.add(proxy);
	wrapper.add(root);

	scene.add(wrapper);

	wrappers[index] = wrapper;
	hoverTargets.push(proxy);
}


/* ==================================================
   LOAD
   ================================================== */

const loader = new GLTFLoader();

async function loadEverything() {
	let loaded = 0;
	const failures = [];

	report(`Loading 0/${ITEMS.length}…`);

	await Promise.all(
		ITEMS.map(async (item, index) => {
			try {
				const gltf = await loader.loadAsync(
					new URL(item.file, window.location.href).href
				);

				const model = normalizeModel(gltf.scene, index);
				createWrapper(model, index);

				loaded += 1;
				report(`Loading ${loaded}/${ITEMS.length}…`);
			} catch (error) {
				console.error("Could not load:", item.file, error);
				failures.push(item.file);
			}
		})
	);

	if (failures.length) {
		report(
			`Loaded ${loaded}/${ITEMS.length}\nFAILED:\n${failures.join("\n")}`,
			true
		);
	} else {
		report(`${loaded}/${ITEMS.length} objects loaded ✓`);
		if (!DEBUG) status.style.display = "none";
	}
}

loadEverything();


/* ==================================================
   HOVER
   ================================================== */

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(999, 999);

let hovered = -1;

function updatePointer(event) {
	const rect = renderer.domElement.getBoundingClientRect();

	pointer.x =
		((event.clientX - rect.left) / rect.width) * 2 - 1;

	pointer.y =
		-((event.clientY - rect.top) / rect.height) * 2 + 1;
}

renderer.domElement.addEventListener("pointermove", (event) => {
	updatePointer(event);

	raycaster.setFromCamera(pointer, camera);

	const hits = raycaster.intersectObjects(hoverTargets, false);
	const next = hits.length ? hits[0].object.userData.itemIndex : -1;

	if (next !== hovered && next >= 0 && wrappers[next]) {
		wrappers[next].userData.spinVelocity += SETTINGS.hoverSpin;
	}

	hovered = next;
});

renderer.domElement.addEventListener("pointerleave", () => {
	hovered = -1;
	pointer.set(999, 999);
});


/* ==================================================
   ORBIT
   ================================================== */

const ringEuler = new THREE.Euler(
	THREE.MathUtils.degToRad(SETTINGS.ringTiltX),
	THREE.MathUtils.degToRad(SETTINGS.ringTiltY),
	THREE.MathUtils.degToRad(SETTINGS.ringTiltZ),
	"XYZ"
);

const ringPosition = new THREE.Vector3();

function updateOrbit(time) {
	wrappers.forEach((wrapper, index) => {
		if (!wrapper) return;

		const angle =
			wrapper.userData.baseAngle +
			time * SETTINGS.speed;

		const orbitNoise =
			1 +
			Math.sin(
				angle * 1.65 +
				wrapper.userData.phase
			) * 0.055;

		const depth = Math.sin(angle);

		const crossPull =
			1 -
			SETTINGS.overlap *
			Math.pow(Math.abs(Math.cos(angle)), 1.35);

		const verticalPull =
			1 -
			SETTINGS.overlap *
			0.38 *
			Math.pow(Math.abs(Math.sin(angle)), 2);

		ringPosition.set(
			Math.cos(angle) *
				SETTINGS.ringWidth *
				wrapper.userData.radiusX *
				orbitNoise *
				crossPull,

			Math.sin(angle) *
				SETTINGS.ringHeight *
				wrapper.userData.radiusY *
				verticalPull,

			Math.sin(angle) *
				SETTINGS.ringDepth
		);

		ringPosition.applyEuler(ringEuler);
		wrapper.position.copy(ringPosition);

		/*
		Keep the same visual idea as the prototype:
		objects at the front become larger.
		*/
		const depthScale = THREE.MathUtils.mapLinear(
			depth,
			-1,
			1,
			1 - SETTINGS.depthScale * 0.22,
			1 + SETTINGS.depthScale * 0.36
		);

		const hoverScale =
			index === hovered ? SETTINGS.hoverBoost : 1;

		const targetScale =
			wrapper.userData.baseSize *
			SETTINGS.objectSize *
			wrapper.userData.customScale *
			depthScale *
			hoverScale;

		const smoothScale = THREE.MathUtils.lerp(
			wrapper.scale.x || targetScale,
			targetScale,
			0.10
		);

		wrapper.scale.setScalar(smoothScale);

		wrapper.userData.spinVelocity *= 0.90;
		wrapper.userData.hoverSpin += wrapper.userData.spinVelocity;

		wrapper.rotation.x =
			wrapper.userData.baseRotX +
			Math.sin(
				time * (0.30 + index * 0.015) +
				wrapper.userData.phase
			) * 0.13;

		wrapper.rotation.y =
			wrapper.userData.baseRotY +
			Math.sin(
				time * (0.24 + index * 0.012) +
				wrapper.userData.phase * 1.3
			) * 0.20 +
			wrapper.userData.hoverSpin;

		wrapper.rotation.z =
			wrapper.userData.baseRotZ +
			Math.cos(
				time * (0.26 + index * 0.011) +
				wrapper.userData.phase
			) * 0.09;
	});
}


/* ==================================================
   RESIZE
   ================================================== */

function resize() {
	const width = Math.max(stage.clientWidth, 1);
	const height = Math.max(stage.clientHeight, 1);

	renderer.setSize(width, height, false);

	camera.aspect = width / height;
	camera.updateProjectionMatrix();
}

window.addEventListener("resize", resize, { passive: true });

if ("ResizeObserver" in window) {
	new ResizeObserver(resize).observe(stage);
}

resize();


/* ==================================================
   LOOP
   ================================================== */

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
	requestAnimationFrame(animate);

	const dt = Math.min(clock.getDelta(), 0.05);
	elapsed += dt;

	updateOrbit(elapsed);
	renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
