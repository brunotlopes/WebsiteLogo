<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes — Visual Calibration</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
		font-family: Arial, sans-serif;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.panel {
		position: absolute;
		top: 16px;
		right: 16px;
		width: 250px;
		padding: 14px 14px 10px;
		background: rgba(255,255,255,.9);
		border: 1px solid rgba(0,0,0,.12);
		border-radius: 12px;
		box-shadow: 0 8px 30px rgba(0,0,0,.08);
		backdrop-filter: blur(10px);
	}

	.panel h3 {
		margin: 0 0 10px;
		font-size: 13px;
		font-weight: 700;
	}

	.row {
		display: grid;
		grid-template-columns: 92px 1fr 42px;
		gap: 8px;
		align-items: center;
		margin: 8px 0;
	}

	.row label {
		font-size: 11px;
		opacity: .7;
	}

	.row input[type="range"] {
		width: 100%;
	}

	.val {
		font-size: 10px;
		text-align: right;
		opacity: .6;
	}

	.status {
		position: absolute;
		left: 14px;
		bottom: 12px;
		font-size: 11px;
		opacity: .3;
		pointer-events: none;
	}
</style>
</head>

<body>
<div id="app">

	<div class="panel">
		<h3>Visual calibration</h3>

		<div class="row">
			<label>Exposure</label>
			<input id="exposure" type="range" min="0.4" max="2.0" step="0.01" value="1.0">
			<div class="val" id="exposureVal">1.00</div>
		</div>

		<div class="row">
			<label>Env</label>
			<input id="env" type="range" min="0" max="3" step="0.01" value="1.1">
			<div class="val" id="envVal">1.10</div>
		</div>

		<div class="row">
			<label>Normal</label>
			<input id="normal" type="range" min="0" max="3" step="0.01" value="1.2">
			<div class="val" id="normalVal">1.20</div>
		</div>

		<div class="row">
			<label>Roughness</label>
			<input id="roughness" type="range" min="0" max="1" step="0.01" value="0.62">
			<div class="val" id="roughnessVal">0.62</div>
		</div>

		<div class="row">
			<label>Key light</label>
			<input id="key" type="range" min="0" max="8" step="0.05" value="3.6">
			<div class="val" id="keyVal">3.60</div>
		</div>

		<div class="row">
			<label>Blue rim</label>
			<input id="blue" type="range" min="0" max="8" step="0.05" value="2.5">
			<div class="val" id="blueVal">2.50</div>
		</div>

		<div class="row">
			<label>Pink rim</label>
			<input id="pink" type="range" min="0" max="8" step="0.05" value="2.0">
			<div class="val" id="pinkVal">2.00</div>
		</div>

		<div class="row">
			<label>Hemi</label>
			<input id="hemi" type="range" min="0" max="5" step="0.05" value="1.4">
			<div class="val" id="hemiVal">1.40</div>
		</div>
	</div>

	<div class="status" id="status">loading…</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
import { RoomEnvironment } from "https://esm.sh/three@0.180.0/examples/jsm/environments/RoomEnvironment.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");
const status = document.querySelector("#status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	28,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   ENVIRONMENT
   ================================================== */

const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment();

const envRT = pmrem.fromScene(room, 0.04);
scene.environment = envRT.texture;

room.dispose();


/* ==================================================
   LIGHTING
   ================================================== */

const hemiLight = new THREE.HemisphereLight(
	0xfff7ec,
	0x4d4c5f,
	1.4
);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(
	0xffffff,
	3.6
);
keyLight.position.set(
	1.2,
	2.7,
	7
);
scene.add(keyLight);

const blueRim = new THREE.DirectionalLight(
	0x7d95ff,
	2.5
);
blueRim.position.set(
	-5,
	3,
	-4
);
scene.add(blueRim);

const pinkRim = new THREE.DirectionalLight(
	0xff8fb4,
	2.0
);
pinkRim.position.set(
	5,
	-2,
	-4
);
scene.add(pinkRim);


/* ==================================================
   MODEL
   ================================================== */

let model = null;
const calibratedMaterials = [];

function frameModel(object) {

	const box = new THREE.Box3().setFromObject(object);

	const center = new THREE.Vector3();
	const size = new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	object.position.sub(center);

	const centered = new THREE.Box3().setFromObject(object);
	centered.getSize(size);

	const maxDim = Math.max(size.x, size.y, size.z);

	const fov = THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim / (2 * Math.tan(fov / 2));

	distance *= 1.32;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near = Math.max(.01, distance / 100);
	camera.far = distance * 100;

	camera.updateProjectionMatrix();
}


function registerMaterial(material) {

	if (!material) return;

	/*
	   Clone so calibration only affects this viewer,
	   not any shared references unexpectedly.
	*/
	const mat = material;

	if ("envMapIntensity" in mat) {
		mat.envMapIntensity = 1.1;
	}

	if ("roughness" in mat) {
		mat.roughness = 0.62;
	}

	if (mat.normalMap) {
		mat.normalScale.set(1.2, 1.2);
	}

	mat.needsUpdate = true;

	calibratedMaterials.push(mat);
}


new GLTFLoader().load(

	"./Name1.glb",

	(gltf) => {

		model = gltf.scene;

		model.rotation.x = Math.PI / 2;

		scene.add(model);

		model.traverse((obj) => {

			if (!obj.isMesh) return;

			if (Array.isArray(obj.material)) {
				obj.material.forEach(registerMaterial);
			}
			else {
				registerMaterial(obj.material);
			}
		});

		frameModel(model);

		status.textContent =
			`${calibratedMaterials.length} materials • static calibration`;
	},

	undefined,

	(error) => {
		console.error(error);
		status.textContent = "could not load Name1.glb";
	}
);


/* ==================================================
   UI
   ================================================== */

function bindRange(
	id,
	valueId,
	callback
) {
	const input = document.getElementById(id);
	const value = document.getElementById(valueId);

	const update = () => {
		const v = parseFloat(input.value);
		value.textContent = v.toFixed(2);
		callback(v);
	};

	input.addEventListener("input", update);
	update();
}


bindRange(
	"exposure",
	"exposureVal",
	(v) => {
		renderer.toneMappingExposure = v;
	}
);


bindRange(
	"env",
	"envVal",
	(v) => {

		calibratedMaterials.forEach((mat) => {

			if ("envMapIntensity" in mat) {
				mat.envMapIntensity = v;
			}

		});
	}
);


bindRange(
	"normal",
	"normalVal",
	(v) => {

		calibratedMaterials.forEach((mat) => {

			if (mat.normalMap) {
				mat.normalScale.set(v, v);
			}

		});
	}
);


bindRange(
	"roughness",
	"roughnessVal",
	(v) => {

		calibratedMaterials.forEach((mat) => {

			if ("roughness" in mat) {
				mat.roughness = v;
			}

		});
	}
);


bindRange(
	"key",
	"keyVal",
	(v) => {
		keyLight.intensity = v;
	}
);


bindRange(
	"blue",
	"blueVal",
	(v) => {
		blueRim.intensity = v;
	}
);


bindRange(
	"pink",
	"pinkVal",
	(v) => {
		pinkRim.intensity = v;
	}
);


bindRange(
	"hemi",
	"hemiVal",
	(v) => {
		hemiLight.intensity = v;
	}
);


/* ==================================================
   LOOP
   ================================================== */

function animate() {

	requestAnimationFrame(animate);

	renderer.render(
		scene,
		camera
	);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			innerWidth / innerHeight;

		camera.updateProjectionMatrix();

		renderer.setSize(
			innerWidth,
			innerHeight
		);
	}
);

</script>
</body>
</html>
