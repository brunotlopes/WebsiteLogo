<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes — Eye Test</title>
<style>
html,body{
	margin:0;
	width:100%;
	height:100%;
	overflow:hidden;
	background:#fff4e0;
}
#app{
	position:relative;
	width:100%;
	height:100%;
}
canvas{
	display:block;
	width:100%;
	height:100%;
}
.status{
	position:absolute;
	left:14px;
	bottom:12px;
	font:11px Arial,sans-serif;
	opacity:.35;
	pointer-events:none;
}
</style>
</head>
<body>

<div id="app">
	<div class="status" id="status">loading…</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const app = document.querySelector("#app");
const status = document.querySelector("#status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	28,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   SIMPLE STATIC LIGHTING
   ================================================== */

scene.add(
	new THREE.HemisphereLight(
		0xfff8ef,
		0x55556a,
		1.5
	)
);

const front = new THREE.DirectionalLight(
	0xffffff,
	3.7
);
front.position.set(1,2.5,7);
scene.add(front);

const rimA = new THREE.DirectionalLight(
	0x8ca5ff,
	2.0
);
rimA.position.set(-5,3,-4);
scene.add(rimA);

const rimB = new THREE.DirectionalLight(
	0xff9bb8,
	1.7
);
rimB.position.set(5,-2,-4);
scene.add(rimB);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2();
const smoothPointer = new THREE.Vector2();

window.addEventListener(
	"pointermove",
	(event)=>{
		pointer.x =
			(event.clientX / innerWidth) * 2 - 1;

		pointer.y =
			-(event.clientY / innerHeight) * 2 + 1;
	},
	{passive:true}
);

window.addEventListener(
	"pointerleave",
	()=>{
		pointer.set(0,0);
	}
);


/* ==================================================
   MODEL
   ================================================== */

let model = null;

let topPupil = null;
let botPupil = null;

let topBase = null;
let botBase = null;


/* ==================================================
   FRAME MODEL
   ================================================== */

function frameModel(object){

	const box =
		new THREE.Box3().setFromObject(object);

	const center =
		new THREE.Vector3();

	const size =
		new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	object.position.sub(center);

	const box2 =
		new THREE.Box3().setFromObject(object);

	box2.getSize(size);

	const maxDim =
		Math.max(
			size.x,
			size.y,
			size.z
		);

	const fov =
		THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim /
		(2 * Math.tan(fov/2));

	distance *= 1.35;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near =
		Math.max(.01,distance/100);

	camera.far =
		distance*100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD
   ================================================== */

new GLTFLoader().load(

	"./Name1.glb",

	(gltf)=>{

		model = gltf.scene;

		/*
		   Correct orientation of your export.
		*/
		model.rotation.x =
			Math.PI / 2;

		scene.add(model);


		topPupil =
			model.getObjectByName(
				"O.Top.Pupil"
			);

		botPupil =
			model.getObjectByName(
				"O.Bot.Pupil"
			);


		if(topPupil){
			topBase =
				topPupil.position.clone();
		}

		if(botPupil){
			botBase =
				botPupil.position.clone();
		}


		frameModel(model);


		status.textContent =
			`original pupils: ${topPupil ? "✓" : "✗"} ${botPupil ? "✓" : "✗"} • X/Z tracking`;

		console.log(
			"TOP PUPIL",
			topPupil,
			topBase
		);

		console.log(
			"BOT PUPIL",
			botPupil,
			botBase
		);
	},

	undefined,

	(error)=>{
		console.error(error);
		status.textContent =
			"could not load Name1.glb";
	}
);


/* ==================================================
   DIRECT EYE TRACKING
   ================================================== */

/*
   I inspected the exported GLB itself.

   In the GLB:
   WHITE and PUPIL have the same X and Z.
   The pupil differs from the white mainly on Y.

   Therefore:
   X = horizontal across eye
   Z = vertical across eye
   Y = depth

   So we preserve Y completely and move only X/Z.
*/

function updatePupil(
	pupil,
	base
){

	if(!pupil || !base){
		return;
	}

	/*
	   Deliberately obvious movement for testing.
	   Once confirmed, we can reduce these values.
	*/
	const maxX = 0.10;
	const maxZ = 0.085;


	let x =
		smoothPointer.x *
		maxX;


	let z =
		-smoothPointer.y *
		maxZ;


	/*
	   Elliptical clamp.
	*/
	const nx =
		x / maxX;

	const nz =
		z / maxZ;

	const len =
		Math.sqrt(
			nx*nx +
			nz*nz
		);


	if(len > 1){
		x /= len;
		z /= len;
	}


	const targetX =
		base.x + x;

	const targetZ =
		base.z + z;


	pupil.position.x +=
		(
			targetX -
			pupil.position.x
		) * 0.30;


	pupil.position.z +=
		(
			targetZ -
			pupil.position.z
		) * 0.30;


	/*
	   Never touch depth.
	*/
	pupil.position.y =
		base.y;
}


/* ==================================================
   LOOP
   ================================================== */

function animate(){

	requestAnimationFrame(animate);

	smoothPointer.lerp(
		pointer,
		0.16
	);

	updatePupil(
		topPupil,
		topBase
	);

	updatePupil(
		botPupil,
		botBase
	);

	renderer.render(
		scene,
		camera
	);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	()=>{
		camera.aspect =
			innerWidth /
			innerHeight;

		camera.updateProjectionMatrix();

		renderer.setSize(
			innerWidth,
			innerHeight
		);
	}
);

</script>
</body>
</html>
