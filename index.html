<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes 3D Logo — Wild Float</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.hint {
		position: absolute;
		left: 16px;
		bottom: 14px;
		font: 12px/1.2 Arial, sans-serif;
		opacity: .35;
		pointer-events: none;
	}
</style>
</head>

<body>

<div id="app">
	<div class="hint">move the mouse • letters run away • wait a few seconds</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	window.innerWidth / window.innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true
});

renderer.setPixelRatio(
	Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
	window.innerWidth,
	window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTING
   ================================================== */

const frontLight = new THREE.DirectionalLight(
	0xffffff,
	3.4
);

frontLight.position.set(
	0,
	0.5,
	8
);

scene.add(frontLight);


const hemi = new THREE.HemisphereLight(
	0xfff4e8,
	0x4d4966,
	1.35
);

scene.add(hemi);


const backLeft = new THREE.DirectionalLight(
	0x6f8cff,
	3.0
);

backLeft.position.set(
	-5,
	3,
	-5
);

scene.add(backLeft);


const backRight = new THREE.DirectionalLight(
	0xff79ad,
	2.8
);

backRight.position.set(
	5,
	-2,
	-5
);

scene.add(backRight);


const cursorLight = new THREE.PointLight(
	0xffffff,
	6.0,
	25
);

cursorLight.position.set(
	0,
	0,
	5
);

scene.add(cursorLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2(0, 0);
const smoothPointer = new THREE.Vector2(0, 0);

let pointerActive = false;

window.addEventListener(
	"pointermove",
	(event) => {

		pointerActive = true;

		pointer.x =
			(event.clientX / window.innerWidth) * 2 - 1;

		pointer.y =
			-(
				(event.clientY / window.innerHeight) * 2 - 1
			);
	},
	{ passive: true }
);

window.addEventListener(
	"pointerleave",
	() => {

		pointerActive = false;

		pointer.set(0, 0);
	}
);


/* ==================================================
   MODEL
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topPupil = null;
let botPupil = null;

const interactiveItems = [];

let modelBounds = null;
let logoWidth = 1;
let logoHeight = 1;


/* ==================================================
   HELPERS
   ================================================== */

function findAny(root, names) {

	for (const name of names) {

		const object = root.getObjectByName(name);

		if (object) {
			return object;
		}
	}

	return null;
}


function rememberBase(object) {

	if (!object) return;

	object.userData.basePosition =
		object.position.clone();

	object.userData.baseRotation =
		object.rotation.clone();

	object.userData.velocity =
		new THREE.Vector3(
			THREE.MathUtils.randFloatSpread(.01),
			THREE.MathUtils.randFloatSpread(.01),
			THREE.MathUtils.randFloatSpread(.006)
		);

	object.userData.angularVelocity =
		new THREE.Vector3(
			THREE.MathUtils.randFloatSpread(.003),
			THREE.MathUtils.randFloatSpread(.003),
			THREE.MathUtils.randFloatSpread(.004)
		);

	object.userData.phase =
		Math.random() * Math.PI * 2;

	object.userData.freqA =
		0.25 + Math.random() * 0.35;

	object.userData.freqB =
		0.20 + Math.random() * 0.30;

	object.userData.freqC =
		0.15 + Math.random() * 0.25;

	object.userData.seedX =
		Math.random() * 100;

	object.userData.seedY =
		Math.random() * 100;

	object.userData.seedZ =
		Math.random() * 100;
}


function addInteractive(object) {

	if (!object) return;

	rememberBase(object);

	if (!interactiveItems.includes(object)) {
		interactiveItems.push(object);
	}
}


/* ==================================================
   CAMERA / BOUNDS
   ================================================== */

function frameObject(object) {

	const box = new THREE.Box3().setFromObject(object);

	const size = new THREE.Vector3();
	const center = new THREE.Vector3();

	box.getSize(size);
	box.getCenter(center);

	object.position.sub(center);

	/*
	   recompute after centering
	*/
	modelBounds =
		new THREE.Box3().setFromObject(object);

	const centeredSize = new THREE.Vector3();

	modelBounds.getSize(centeredSize);

	logoWidth = centeredSize.x;
	logoHeight = centeredSize.z;

	const maxDim = Math.max(
		centeredSize.x,
		centeredSize.z,
		centeredSize.y
	);

	const fov =
		THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim /
		(2 * Math.tan(fov / 2));

	/*
	   Extra room because the letters will spread.
	*/
	distance *= 1.65;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near =
		Math.max(0.01, distance / 100);

	camera.far =
		distance * 100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD
   ================================================== */

const loader = new GLTFLoader();

loader.load(

	"./Name1.glb",

	(gltf) => {

		model = gltf.scene;

		/*
		   Correct orientation.
		*/
		model.rotation.x =
			Math.PI / 2;

		scene.add(model);


		model.traverse(
			(object) => {

				if (
					object.isMesh &&
					object.material
				) {
					object.material.needsUpdate = true;
				}
			}
		);


		topControl = findAny(
			model,
			[
				"O_TOP_CONTROL",
				"O.Top.Control",
				"O_TOP_CTRL"
			]
		);

		botControl = findAny(
			model,
			[
				"O_BOT_CONTROL",
				"O.Bot.Control",
				"O_BOT_CTRL"
			]
		);

		topPupil = findAny(
			model,
			[
				"O.Top.Pupil",
				"O_TOP_PUPIL",
				"Pupil.Top"
			]
		);

		botPupil = findAny(
			model,
			[
				"O.Bot.Pupil",
				"O_BOT_PUPIL",
				"Pupil.Bot"
			]
		);


		[
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		].forEach(
			(name) => {

				addInteractive(
					model.getObjectByName(name)
				);
			}
		);


		addInteractive(topControl);
		addInteractive(botControl);


		if (topPupil) {
			rememberBase(topPupil);
		}

		if (botPupil) {
			rememberBase(botPupil);
		}


		frameObject(model);


		console.log(
			"Top pupil:",
			topPupil
		);

		console.log(
			"Bottom pupil:",
			botPupil
		);

		console.log(
			"Interactive objects:",
			interactiveItems
		);
	},

	undefined,

	(error) => {

		console.error(error);

		document.querySelector(
			".hint"
		).textContent =
			"Could not load Name1.glb";
	}
);


/* ==================================================
   EYES
   ================================================== */

/*
   IMPORTANT:
   The pupils move in LOCAL X/Y.

   The entire GLB root is rotated +90° on X,
   so Blender's local Y becomes screen vertical.
*/

function updatePupil(
	pupil,
	control,
	strength = 1
) {

	if (
		!pupil ||
		!pupil.userData.basePosition
	) {
		return;
	}


	const base =
		pupil.userData.basePosition;


	/*
	   Much larger movement than before,
	   so the tracking is very obvious.
	*/

	const maxX = 0.105;
	const maxY = 0.085;


	let targetX =
		smoothPointer.x * maxX;

	let targetY =
		smoothPointer.y * maxY;


	const nx =
		targetX / maxX;

	const ny =
		targetY / maxY;

	const length =
		Math.sqrt(
			nx * nx +
			ny * ny
		);


	if (length > 1) {

		targetX /= length;
		targetY /= length;
	}


	pupil.position.x +=
		(
			base.x +
			targetX -
			pupil.position.x
		) * 0.22;


	pupil.position.y +=
		(
			base.y +
			targetY -
			pupil.position.y
		) * 0.22;


	/*
	   Simulated collision pressure.
	*/

	const pressure =
		THREE.MathUtils.smoothstep(
			length,
			0.62,
			1.0
		);


	if (
		control &&
		control.userData.baseRotation
	) {

		const br =
			control.userData.baseRotation;


		const targetRotZ =
			br.z
			-
			smoothPointer.x
			*
			pressure
			*
			0.18
			*
			strength;


		const targetRotX =
			br.x
			+
			smoothPointer.y
			*
			pressure
			*
			0.08
			*
			strength;


		control.rotation.z +=
			(
				targetRotZ -
				control.rotation.z
			) * 0.10;


		control.rotation.x +=
			(
				targetRotX -
				control.rotation.x
			) * 0.10;
	}
}


/* ==================================================
   WILD FLOAT / REPULSION
   ================================================== */

const tempWorld = new THREE.Vector3();
const tempScreen = new THREE.Vector3();

function updateLetters(time) {

	/*
	   At first the name stays readable.
	   After a few seconds the freedom ramps up.
	*/

	const chaos =
		THREE.MathUtils.smoothstep(
			time,
			2.0,
			10.0
		);


	interactiveItems.forEach(
		(object, index) => {

			if (
				!object.userData.basePosition ||
				!object.userData.baseRotation
			) {
				return;
			}


			const base =
				object.userData.basePosition;

			const velocity =
				object.userData.velocity;

			const angularVelocity =
				object.userData.angularVelocity;

			const phase =
				object.userData.phase;


			/* --------------------------------------
			   AUTONOMOUS DRIFT
			   -------------------------------------- */

			const wanderX =
				(
					Math.sin(
						time *
						object.userData.freqA +
						phase
					)
					+
					0.55 *
					Math.sin(
						time *
						(object.userData.freqB * 1.7) +
						object.userData.seedX
					)
				)
				*
				logoWidth
				*
				0.0055
				*
				chaos;


			const wanderY =
				(
					Math.cos(
						time *
						object.userData.freqB +
						phase * 1.3
					)
					+
					0.5 *
					Math.sin(
						time *
						(object.userData.freqC * 1.9) +
						object.userData.seedY
					)
				)
				*
				logoHeight
				*
				0.006
				*
				chaos;


			const wanderDepth =
				Math.sin(
					time *
					object.userData.freqC +
					object.userData.seedZ
				)
				*
				logoWidth
				*
				0.0018
				*
				chaos;


			velocity.x += wanderX;
			velocity.y += wanderY;
			velocity.z += wanderDepth;


			/* --------------------------------------
			   MOUSE REPULSION
			   -------------------------------------- */

			object.getWorldPosition(tempWorld);

			tempScreen
				.copy(tempWorld)
				.project(camera);


			const dx =
				tempScreen.x -
				smoothPointer.x;

			const dy =
				tempScreen.y -
				smoothPointer.y;


			const distance =
				Math.sqrt(
					dx * dx +
					dy * dy
				);


			/*
			   Wide field:
			   mouse pushes letters even when
			   moving through gaps.
			*/

			const radius = 0.42;


			let influence =
				1 -
				(distance / radius);


			influence =
				THREE.MathUtils.clamp(
					influence,
					0,
					1
				);


			influence =
				influence *
				influence;


			if (influence > 0) {

				const dirLength =
					Math.sqrt(
						dx * dx +
						dy * dy
					) || 1;


				const dirX =
					dx / dirLength;


				const dirY =
					dy / dirLength;


				/*
				   Strong "run away" force.
				*/

				const force =
					influence
					*
					0.018;


				velocity.x +=
					dirX * force;


				velocity.y +=
					dirY * force;


				/*
				   Some depth kick.
				*/

				velocity.z +=
					influence
					*
					0.0045;


				angularVelocity.x +=
					dirY
					*
					influence
					*
					0.006;


				angularVelocity.y +=
					dirX
					*
					influence
					*
					0.009;


				angularVelocity.z +=
					(dirX - dirY)
					*
					influence
					*
					0.007;
			}


			/* --------------------------------------
			   VERY WEAK HOME GRAVITY
			   -------------------------------------- */

			/*
			   It becomes weaker with time,
			   so eventually BRUNO LOPES can
			   become almost unrecognizable.
			*/

			const homeStrength =
				THREE.MathUtils.lerp(
					0.012,
					0.0018,
					chaos
				);


			velocity.x +=
				(
					base.x -
					object.position.x
				)
				*
				homeStrength;


			velocity.y +=
				(
					base.y -
					object.position.y
				)
				*
				homeStrength;


			velocity.z +=
				(
					base.z -
					object.position.z
				)
				*
				0.006;


			/* --------------------------------------
			   CONTAINMENT — MENU BOX
			   -------------------------------------- */

			/*
			   Letters are free, but remain inside
			   an invisible box around the logo.
			*/

			const halfW =
				logoWidth * 0.72;


			const halfH =
				logoHeight * 0.92;


			const minX =
				-halfW;


			const maxX =
				halfW;


			const minY =
				-halfH;


			const maxY =
				halfH;


			if (object.position.x < minX) {

				velocity.x +=
					(minX - object.position.x)
					*
					0.035;
			}


			if (object.position.x > maxX) {

				velocity.x +=
					(maxX - object.position.x)
					*
					0.035;
			}


			if (object.position.y < minY) {

				velocity.y +=
					(minY - object.position.y)
					*
					0.035;
			}


			if (object.position.y > maxY) {

				velocity.y +=
					(maxY - object.position.y)
					*
					0.035;
			}


			/* --------------------------------------
			   APPLY VELOCITY
			   -------------------------------------- */

			velocity.multiplyScalar(
				0.965
			);


			object.position.add(
				velocity
			);


			/* --------------------------------------
			   ROTATION — MUCH STRONGER
			   -------------------------------------- */

			angularVelocity.x +=
				Math.sin(
					time * 0.34 +
					phase
				)
				*
				0.0007
				*
				chaos;


			angularVelocity.y +=
				Math.cos(
					time * 0.29 +
					phase
				)
				*
				0.0010
				*
				chaos;


			angularVelocity.z +=
				Math.sin(
					time * 0.24 +
					phase * 1.4
				)
				*
				0.0008
				*
				chaos;


			angularVelocity.multiplyScalar(
				0.975
			);


			object.rotation.x +=
				angularVelocity.x;


			object.rotation.y +=
				angularVelocity.y;


			object.rotation.z +=
				angularVelocity.z;
		}
	);
}


/* ==================================================
   CURSOR LIGHT
   ================================================== */

function updateCursorLight() {

	cursorLight.position.x +=
		(
			smoothPointer.x * 5.5 -
			cursorLight.position.x
		) * 0.07;


	cursorLight.position.y +=
		(
			smoothPointer.y * 3.5 -
			cursorLight.position.y
		) * 0.07;


	cursorLight.position.z = 5.5;
}


/* ==================================================
   LOOP
   ================================================== */

const clock = new THREE.Clock();

function animate() {

	requestAnimationFrame(animate);

	const time =
		clock.getElapsedTime();


	smoothPointer.lerp(
		pointer,
		0.10
	);


	if (model) {

		updateLetters(time);

		updatePupil(
			topPupil,
			topControl,
			1.0
		);

		updatePupil(
			botPupil,
			botControl,
			0.95
		);
	}


	updateCursorLight();


	renderer.render(
		scene,
		camera
	);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			window.innerWidth /
			window.innerHeight;

		camera.updateProjectionMatrix();

		renderer.setSize(
			window.innerWidth,
			window.innerHeight
		);
	}
);

</script>

</body>
</html>
