<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes — Site Scale + Eye Fix</title>

<style>
	html,body{
		margin:0;
		width:100%;
		height:100%;
		overflow:hidden;
		background:#fff4e0;
		font-family:Arial,sans-serif;
	}

	.site{
		position:relative;
		width:100%;
		height:100%;
		background:#fff4e0;
	}

	.sidebar{
		position:absolute;
		left:0;
		top:0;
		width:420px;
		height:100%;
	}

	.logo-slot{
		position:absolute;
		left:52px;
		top:54px;
		width:310px;
		height:215px;
	}

	.logo-slot canvas{
		display:block;
		width:100%;
		height:100%;
	}

	.fake-menu{
		position:absolute;
		left:68px;
		top:275px;
		font-size:16px;
		line-height:2.45;
		opacity:.7;
		pointer-events:none;
	}

	.fake-menu b{
		display:block;
		font-size:19px;
		margin-bottom:6px;
	}

	.fake-content{
		position:absolute;
		left:470px;
		right:55px;
		top:55px;
		height:calc(100% - 110px);
		border:2px solid rgba(0,0,0,.72);
		border-radius:36px;
		background:#fff4e0;
		opacity:.28;
		pointer-events:none;
	}

	.panel{
		position:absolute;
		top:16px;
		right:16px;
		width:255px;
		padding:14px;
		background:rgba(255,255,255,.92);
		border:1px solid rgba(0,0,0,.12);
		border-radius:12px;
		box-shadow:0 8px 30px rgba(0,0,0,.08);
		backdrop-filter:blur(10px);
		z-index:10;
	}

	.panel h3{
		margin:0 0 10px;
		font-size:13px;
	}

	.row{
		display:grid;
		grid-template-columns:92px 1fr 42px;
		gap:8px;
		align-items:center;
		margin:7px 0;
	}

	.row label{
		font-size:11px;
		opacity:.7;
	}

	.row input[type="range"]{
		width:100%;
	}

	.val{
		font-size:10px;
		text-align:right;
		opacity:.6;
	}

	.eye-test{
		margin-top:10px;
		padding-top:9px;
		border-top:1px solid rgba(0,0,0,.1);
		font-size:11px;
		display:flex;
		align-items:center;
		gap:7px;
	}

	.status{
		position:absolute;
		left:14px;
		bottom:12px;
		font-size:11px;
		opacity:.35;
		z-index:20;
	}
</style>
</head>

<body>

<div class="site">

	<div class="sidebar">

		<div class="logo-slot" id="logoSlot"></div>

		<div class="fake-menu">
			<b>MOTION GRAPHICS * VFX</b>
			Showreel<br>
			Playground<br>
			Futster<br>
			Gobelins JPO<br>
			Universal Music France<br>
			Museum D'Orsay
		</div>

	</div>

	<div class="fake-content"></div>

	<div class="panel">

		<h3>Visual calibration</h3>

		<div class="row">
			<label>Exposure</label>
			<input id="exposure" type="range" min=".2" max="2" step=".01" value=".40">
			<div class="val" id="exposureVal">0.40</div>
		</div>

		<div class="row">
			<label>Env</label>
			<input id="env" type="range" min="0" max="3" step=".01" value="0">
			<div class="val" id="envVal">0.00</div>
		</div>

		<div class="row">
			<label>Normal</label>
			<input id="normal" type="range" min="0" max="3" step=".01" value="1.96">
			<div class="val" id="normalVal">1.96</div>
		</div>

		<div class="row">
			<label>Roughness</label>
			<input id="roughness" type="range" min="0" max="1" step=".01" value=".51">
			<div class="val" id="roughnessVal">0.51</div>
		</div>

		<div class="row">
			<label>Key light</label>
			<input id="key" type="range" min="0" max="8" step=".05" value="2.80">
			<div class="val" id="keyVal">2.80</div>
		</div>

		<div class="row">
			<label>Blue rim</label>
			<input id="blue" type="range" min="0" max="8" step=".05" value="5.20">
			<div class="val" id="blueVal">5.20</div>
		</div>

		<div class="row">
			<label>Pink rim</label>
			<input id="pink" type="range" min="0" max="8" step=".05" value="1.95">
			<div class="val" id="pinkVal">1.95</div>
		</div>

		<div class="row">
			<label>Hemi</label>
			<input id="hemi" type="range" min="0" max="5" step=".05" value="0">
			<div class="val" id="hemiVal">0.00</div>
		</div>

		<div class="row">
			<label>Logo zoom</label>
			<input id="zoom" type="range" min=".75" max="1.8" step=".01" value="1.12">
			<div class="val" id="zoomVal">1.12</div>
		</div>

		<div class="row">
			<label>Eye range</label>
			<input id="eyeRange" type="range" min="0" max=".06" step=".001" value=".030">
			<div class="val" id="eyeRangeVal">0.030</div>
		</div>

		<div class="eye-test">
			<input id="autoEyes" type="checkbox">
			<label for="autoEyes">auto-orbit eyes (debug)</label>
		</div>

	</div>

	<div class="status" id="status">loading…</div>

</div>


<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
import { RoomEnvironment } from "https://esm.sh/three@0.180.0/examples/jsm/environments/RoomEnvironment.js";


/* ==================================================
   SITE-SIZED RENDERER
   ================================================== */

const slot =
	document.querySelector("#logoSlot");

const status =
	document.querySelector("#status");

const scene =
	new THREE.Scene();


const renderer =
	new THREE.WebGLRenderer({
		antialias:true,
		alpha:true
	});

renderer.setClearColor(
	0x000000,
	0
);

renderer.setPixelRatio(
	Math.min(
		devicePixelRatio,
		2
	)
);

renderer.outputColorSpace =
	THREE.SRGBColorSpace;

renderer.toneMapping =
	THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
	.40;

slot.appendChild(
	renderer.domElement
);


const camera =
	new THREE.PerspectiveCamera(
		28,
		1,
		.01,
		100
	);


/* ==================================================
   ENVIRONMENT + LIGHTS
   ================================================== */

const pmrem =
	new THREE.PMREMGenerator(
		renderer
	);

const envRT =
	pmrem.fromScene(
		new RoomEnvironment(),
		.04
	);

scene.environment =
	envRT.texture;


const hemi =
	new THREE.HemisphereLight(
		0xfff7ec,
		0x4d4c5f,
		0
	);

scene.add(
	hemi
);


const key =
	new THREE.DirectionalLight(
		0xffffff,
		2.80
	);

key.position.set(
	1.2,
	2.7,
	7
);

scene.add(
	key
);


const blue =
	new THREE.DirectionalLight(
		0x7d95ff,
		5.20
	);

blue.position.set(
	-5,
	3,
	-4
);

scene.add(
	blue
);


const pink =
	new THREE.DirectionalLight(
		0xff8fb4,
		1.95
	);

pink.position.set(
	5,
	-2,
	-4
);

scene.add(
	pink
);


/* ==================================================
   POINTER
   ================================================== */

const pointer =
	new THREE.Vector2();

const smoothPointer =
	new THREE.Vector2();


window.addEventListener(
	"pointermove",
	(event) => {

		/*
		   IMPORTANT:
		   pointer is relative to the LOGO SLOT,
		   not the whole browser window.

		   This makes the eye response correct at
		   the real menu size.
		*/

		const rect =
			slot.getBoundingClientRect();


		const x =
			(event.clientX -
				rect.left) /
			rect.width;


		const y =
			(event.clientY -
				rect.top) /
			rect.height;


		pointer.x =
			x * 2 - 1;


		pointer.y =
			-(y * 2 - 1);
	},
	{ passive:true }
);


window.addEventListener(
	"pointerleave",
	() => {

		pointer.set(
			0,
			0
		);

	}
);


/* ==================================================
   MODEL
   ================================================== */

let model = null;

let baseCameraDistance =
	1;

let zoomFactor =
	1.12;

const materials =
	[];


let topControl = null;
let botControl = null;

let topOriginalPupil = null;
let botOriginalPupil = null;

let topPupil = null;
let botPupil = null;

let topBase = null;
let botBase = null;

let eyeRange =
	.030;


/* ==================================================
   HELPERS
   ================================================== */

function get(name) {

	return model
		? model.getObjectByName(
			name
		)
		: null;

}


function resizeRenderer() {

	const rect =
		slot.getBoundingClientRect();


	renderer.setSize(
		rect.width,
		rect.height,
		false
	);


	camera.aspect =
		rect.width /
		rect.height;


	camera.updateProjectionMatrix();

}


function frameModel(object) {

	const box =
		new THREE.Box3()
			.setFromObject(
				object
			);


	const center =
		new THREE.Vector3();


	const size =
		new THREE.Vector3();


	box.getCenter(
		center
	);

	box.getSize(
		size
	);


	object.position.sub(
		center
	);


	const box2 =
		new THREE.Box3()
			.setFromObject(
				object
			);


	box2.getSize(
		size
	);


	const maxDim =
		Math.max(
			size.x,
			size.y,
			size.z
		);


	const fov =
		THREE.MathUtils.degToRad(
			camera.fov
		);


	baseCameraDistance =
		maxDim /
		(
			2 *
			Math.tan(
				fov / 2
			)
		);


	baseCameraDistance *=
		1.08;


	camera.position.set(
		0,
		0,
		baseCameraDistance /
			zoomFactor
	);


	camera.near =
		Math.max(
			.01,
			baseCameraDistance /
				100
		);


	camera.far =
		baseCameraDistance *
		100;


	camera.updateProjectionMatrix();

}


function registerMaterial(mat) {

	if (!mat) {
		return;
	}


	if (
		"envMapIntensity"
		in mat
	) {

		mat.envMapIntensity =
			0;

	}


	if (
		"roughness"
		in mat
	) {

		mat.roughness =
			.51;

	}


	if (
		mat.normalMap
	) {

		mat.normalScale.set(
			1.96,
			1.96
		);

	}


	mat.needsUpdate =
		true;


	materials.push(
		mat
	);

}


/* ==================================================
   REBUILD PUPIL AS A SIMPLE THREE.JS CIRCLE
   ================================================== */

/*
   This is the key change.

   We do NOT move the GLB pupil anymore.

   We hide it and create a brand-new black circle
   DIRECTLY under O_TOP_CONTROL / O_BOT_CONTROL.

   We know the GLB eye plane is local X/Z and Y is depth.

   This removes any weird transform, mesh, material,
   parent inverse, or export issue from the pupil itself.
*/

function rebuildPupil(
	control,
	originalPupil
) {

	if (
		!control ||
		!originalPupil
	) {

		return null;

	}


	/*
	   Measure the exported pupil.
	*/

	const worldBox =
		new THREE.Box3()
			.setFromObject(
				originalPupil
			);


	const worldSize =
		new THREE.Vector3();


	worldBox.getSize(
		worldSize
	);


	const radius =
		Math.max(
			worldSize.x,
			worldSize.y,
			worldSize.z
		) *
		0.50;


	/*
	   CircleGeometry starts in XY.
	   Rotate it +90° around X so it lies in X/Z,
	   facing along local Y — exactly like your eye.
	*/

	const geometry =
		new THREE.CircleGeometry(
			radius,
			40
		);


	geometry.rotateX(
		Math.PI / 2
	);


	const material =
		new THREE.MeshBasicMaterial({
			color:0x101010,
			side:THREE.DoubleSide,
			depthTest:true,
			depthWrite:true
		});


	const pupil =
		new THREE.Mesh(
			geometry,
			material
		);


	/*
	   Because original pupil is already a direct child
	   of the same CONTROL in your corrected GLB,
	   its local position is exactly the reference we want.
	*/

	pupil.position.copy(
		originalPupil.position
	);


	pupil.rotation.set(
		0,
		0,
		0
	);


	pupil.name =
		originalPupil.name +
		".JS";


	control.add(
		pupil
	);


	/*
	   Hide old GLB pupil.
	*/

	originalPupil.visible =
		false;


	return pupil;

}


/* ==================================================
   LOAD
   ================================================== */

new GLTFLoader().load(

	"./Name1.glb",

	(gltf) => {

		model =
			gltf.scene;


		model.rotation.x =
			Math.PI / 2;


		scene.add(
			model
		);


		model.traverse(
			(obj) => {

				if (
					!obj.isMesh
				) {
					return;
				}


				if (
					Array.isArray(
						obj.material
					)
				) {

					obj.material.forEach(
						registerMaterial
					);

				}
				else {

					registerMaterial(
						obj.material
					);

				}

			}
		);


		topControl =
			get(
				"O_TOP_CONTROL"
			);


		botControl =
			get(
				"O_BOT_CONTROL"
			);


		topOriginalPupil =
			get(
				"O.Top.Pupil"
			);


		botOriginalPupil =
			get(
				"O.Bot.Pupil"
			);


		/*
		   Rebuild black pupils AFTER loading.
		*/

		topPupil =
			rebuildPupil(
				topControl,
				topOriginalPupil
			);


		botPupil =
			rebuildPupil(
				botControl,
				botOriginalPupil
			);


		if (
			topPupil
		) {

			topBase =
				topPupil.position.clone();

		}


		if (
			botPupil
		) {

			botBase =
				botPupil.position.clone();

		}


		resizeRenderer();

		frameModel(
			model
		);


		status.textContent =
			`rebuilt eyes ${topPupil ? "✓" : "✗"} ${botPupil ? "✓" : "✗"} • site-size preview`;


		console.log(
			"TOP JS PUPIL",
			topPupil
		);


		console.log(
			"BOT JS PUPIL",
			botPupil
		);

	},

	undefined,

	(error) => {

		console.error(
			error
		);


		status.textContent =
			"could not load Name1.glb";

	}

);


/* ==================================================
   EYE MOVEMENT
   ================================================== */

function updatePupil(
	pupil,
	base,
	time,
	phase
) {

	if (
		!pupil ||
		!base
	) {
		return;
	}


	let gx =
		smoothPointer.x;


	let gy =
		smoothPointer.y;


	/*
	   Debug mode ignores mouse and circles forever.

	   If checked, the pupil MUST visibly orbit.
	*/

	if (
		document
			.querySelector(
				"#autoEyes"
			)
			.checked
	) {

		gx =
			Math.sin(
				time * 1.7 +
				phase
			);


		gy =
			Math.cos(
				time * 1.4 +
				phase
			);

	}


	const len =
		Math.sqrt(
			gx * gx +
			gy * gy
		);


	if (
		len > 1
	) {

		gx /=
			len;


		gy /=
			len;

	}


	/*
	   Local X = horizontal
	   Local Z = vertical
	   Local Y = depth, untouched
	*/

	const targetX =
		base.x +
		gx *
		eyeRange;


	const targetZ =
		base.z -
		gy *
		eyeRange;


	pupil.position.x +=
		(
			targetX -
			pupil.position.x
		) *
		.32;


	pupil.position.z +=
		(
			targetZ -
			pupil.position.z
		) *
		.32;


	pupil.position.y =
		base.y;

}


/* ==================================================
   UI
   ================================================== */

function bindRange(
	id,
	valId,
	cb,
	digits = 2
) {

	const input =
		document.getElementById(
			id
		);


	const val =
		document.getElementById(
			valId
		);


	function update() {

		const v =
			parseFloat(
				input.value
			);


		val.textContent =
			v.toFixed(
				digits
			);


		cb(v);

	}


	input.addEventListener(
		"input",
		update
	);


	update();

}


bindRange(
	"exposure",
	"exposureVal",
	(v) => {
		renderer.toneMappingExposure =
			v;
	}
);


bindRange(
	"env",
	"envVal",
	(v) => {

		materials.forEach(
			(mat) => {

				if (
					"envMapIntensity"
					in mat
				) {

					mat.envMapIntensity =
						v;

				}

			}
		);

	}
);


bindRange(
	"normal",
	"normalVal",
	(v) => {

		materials.forEach(
			(mat) => {

				if (
					mat.normalMap
				) {

					mat.normalScale.set(
						v,
						v
					);

				}

			}
		);

	}
);


bindRange(
	"roughness",
	"roughnessVal",
	(v) => {

		materials.forEach(
			(mat) => {

				if (
					"roughness"
					in mat
				) {

					mat.roughness =
						v;

				}

			}
		);

	}
);


bindRange(
	"key",
	"keyVal",
	(v) => {

		key.intensity =
			v;

	}
);


bindRange(
	"blue",
	"blueVal",
	(v) => {

		blue.intensity =
			v;

	}
);


bindRange(
	"pink",
	"pinkVal",
	(v) => {

		pink.intensity =
			v;

	}
);


bindRange(
	"hemi",
	"hemiVal",
	(v) => {

		hemi.intensity =
			v;

	}
);


bindRange(
	"zoom",
	"zoomVal",
	(v) => {

		zoomFactor =
			v;


		if (
			model
		) {

			camera.position.z =
				baseCameraDistance /
				zoomFactor;

		}

	}
);


bindRange(
	"eyeRange",
	"eyeRangeVal",
	(v) => {

		eyeRange =
			v;

	},
	3
);


/* ==================================================
   LOOP
   ================================================== */

const clock =
	new THREE.Clock();


function animate() {

	requestAnimationFrame(
		animate
	);


	const time =
		clock.getElapsedTime();


	smoothPointer.lerp(
		pointer,
		.16
	);


	updatePupil(
		topPupil,
		topBase,
		time,
		0
	);


	updatePupil(
		botPupil,
		botBase,
		time,
		1.5
	);


	renderer.render(
		scene,
		camera
	);

}


animate();


window.addEventListener(
	"resize",
	() => {

		resizeRenderer();


		if (
			model
		) {

			frameModel(
				model
			);

		}

	}
);


resizeRenderer();

</script>
</body>
</html>
