<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruno Lopes — Raw DOM Eye Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff4e0;font-family:Arial,sans-serif}
.site{position:relative;width:100%;height:100%}
.sidebar{position:absolute;left:0;top:0;width:420px;height:100%}
.logo-slot{position:absolute;left:52px;top:44px;width:310px;height:205px}
.logo-slot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pupil{
	position:absolute;
	width:14px;height:14px;border-radius:50%;
	background:#080808;
	z-index:9999;
	pointer-events:none;
	transform:translate(-50%,-50%);
	box-shadow:0 0 0 1px rgba(255,255,255,.18);
}
.fake-menu{position:absolute;left:68px;top:258px;font-size:16px;line-height:2.35;opacity:.68;pointer-events:none}
.fake-menu b{display:block;font-size:19px;margin-bottom:6px}
.fake-content{position:absolute;left:470px;right:55px;top:55px;height:calc(100% - 110px);border:2px solid rgba(0,0,0,.68);border-radius:36px;opacity:.16}
.panel{position:absolute;right:14px;top:14px;width:290px;padding:14px;background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.12);border-radius:12px;z-index:10000}
.panel h3{font-size:13px;margin:0 0 10px}
.row{display:grid;grid-template-columns:105px 1fr 48px;gap:8px;align-items:center;margin:6px 0}
.row label{font-size:11px;opacity:.72}.row input{width:100%}.val{font-size:10px;text-align:right;opacity:.65}
.debug{margin-top:10px;padding-top:10px;border-top:1px solid #ddd;font:11px/1.45 monospace;white-space:pre-line}
.status{position:absolute;left:14px;bottom:12px;font-size:11px;opacity:.4}
</style>
</head>
<body>
<div class="site">
	<div class="sidebar">
		<div class="logo-slot" id="logoSlot">
			<div class="pupil" id="p1"></div>
			<div class="pupil" id="p2"></div>
		</div>
		<div class="fake-menu"><b>MOTION GRAPHICS * VFX</b>Showreel<br>Playground<br>Futster<br>Gobelins JPO<br>Universal Music France<br>Museum D'Orsay</div>
	</div>
	<div class="fake-content"></div>

	<div class="panel">
		<h3>RAW DOM eye test</h3>

		<div class="row"><label>Top X %</label><input id="topX" type="range" min="0" max="100" step=".1" value="70"><span class="val" id="topXv"></span></div>
		<div class="row"><label>Top Y %</label><input id="topY" type="range" min="0" max="100" step=".1" value="35"><span class="val" id="topYv"></span></div>
		<div class="row"><label>Bottom X %</label><input id="botX" type="range" min="0" max="100" step=".1" value="47"><span class="val" id="botXv"></span></div>
		<div class="row"><label>Bottom Y %</label><input id="botY" type="range" min="0" max="100" step=".1" value="70"><span class="val" id="botYv"></span></div>
		<div class="row"><label>Eye movement</label><input id="move" type="range" min="0" max="35" step=".5" value="20"><span class="val" id="movev"></span></div>
		<div class="row"><label>Pupil size</label><input id="size" type="range" min="4" max="30" step=".5" value="14"><span class="val" id="sizev"></span></div>

		<div class="debug" id="debug">waiting for pointer…</div>
	</div>

	<div class="status" id="status">loading GLB…</div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

const slot=document.querySelector("#logoSlot");
const p1=document.querySelector("#p1");
const p2=document.querySelector("#p2");
const debug=document.querySelector("#debug");
const status=document.querySelector("#status");

const ui={};
for(const id of ["topX","topY","botX","botY","move","size"]){
	ui[id]=document.querySelector("#"+id);
	const out=document.querySelector("#"+id+"v");
	const update=()=>out.textContent=parseFloat(ui[id].value).toFixed(1);
	ui[id].addEventListener("input",update); update();
}

/* This pointer test is intentionally independent from Three.js. */
let mouseX=window.innerWidth/2, mouseY=window.innerHeight/2;
let eventCount=0;

function receivePointer(e){
	mouseX=e.clientX;
	mouseY=e.clientY;
	eventCount++;
}
window.addEventListener("pointermove",receivePointer,{passive:true});
window.addEventListener("mousemove",receivePointer,{passive:true});

/* Minimal 3D: only so the real logo remains visible behind the DOM test. */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,1,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.40;
slot.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff7ec,0x4d4c5f,0));
const key=new THREE.DirectionalLight(0xffffff,2.8); key.position.set(1.2,3.5,7); scene.add(key);
const blue=new THREE.DirectionalLight(0x7d95ff,5.2); blue.position.set(-5,3,-4); scene.add(blue);
const pink=new THREE.DirectionalLight(0xff8fb4,1.95); pink.position.set(5,-2,-4); scene.add(pink);

let model=null;

function resize(){
	const r=slot.getBoundingClientRect();
	renderer.setSize(r.width,r.height,false);
	camera.aspect=r.width/r.height;
	camera.updateProjectionMatrix();
}
function frame(obj){
	const box=new THREE.Box3().setFromObject(obj), center=new THREE.Vector3(), size=new THREE.Vector3();
	box.getCenter(center); box.getSize(size); obj.position.sub(center);
	const b2=new THREE.Box3().setFromObject(obj); b2.getSize(size);
	const max=Math.max(size.x,size.y,size.z);
	let d=max/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2))*1.08;
	camera.position.set(0,0,d); camera.near=Math.max(.01,d/100); camera.far=d*100; camera.updateProjectionMatrix();
}

new GLTFLoader().load("./Name1.glb",g=>{
	model=g.scene;
	model.rotation.x=Math.PI/2;
	scene.add(model);
	/* hide only GLB pupils if names exist */
	const a=model.getObjectByName("O.Top.Pupil"), b=model.getObjectByName("O.Bot.Pupil");
	if(a)a.visible=false;if(b)b.visible=false;
	resize(); frame(model);
	status.textContent="GLB loaded ✓ • DOM eyes independent";
},undefined,e=>{console.error(e);status.textContent="GLB load failed — DOM test still works";});

function eyePosition(el, xPct, yPct, rect, movement, pupilSize){
	const baseX=rect.width*(xPct/100);
	const baseY=rect.height*(yPct/100);

	/* direction from each eye toward actual browser mouse */
	const eyeScreenX=rect.left+baseX;
	const eyeScreenY=rect.top+baseY;
	let dx=mouseX-eyeScreenX, dy=mouseY-eyeScreenY;
	const len=Math.hypot(dx,dy)||1;
	dx/=len;dy/=len;

	el.style.left=(baseX+dx*movement)+"px";
	el.style.top=(baseY+dy*movement)+"px";
	el.style.width=pupilSize+"px";
	el.style.height=pupilSize+"px";
}

function loop(){
	requestAnimationFrame(loop);

	const rect=slot.getBoundingClientRect();
	const move=parseFloat(ui.move.value);
	const size=parseFloat(ui.size.value);

	eyePosition(p1,parseFloat(ui.topX.value),parseFloat(ui.topY.value),rect,move,size);
	eyePosition(p2,parseFloat(ui.botX.value),parseFloat(ui.botY.value),rect,move,size);

	debug.textContent=
`POINTER EVENTS: ${eventCount}
mouse X: ${Math.round(mouseX)}
mouse Y: ${Math.round(mouseY)}
slot: ${Math.round(rect.width)} × ${Math.round(rect.height)}

Move mouse anywhere.
The numbers above MUST change.`;

	renderer.render(scene,camera);
}
loop();

window.addEventListener("resize",()=>{resize();if(model)frame(model)});
resize();
</script>
</body>
</html>
