<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes 3D Logo Test</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.hint {
		position: absolute;
		left: 18px;
		bottom: 16px;
		font: 12px/1.2 Arial, sans-serif;
		opacity: .4;
		pointer-events: none;
	}
</style>
</head>

<body>

<div id="app">
	<div class="hint">move the mouse • letters repel • eyes follow</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	window.innerWidth / window.innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true
});

renderer.setPixelRatio(
	Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
	window.innerWidth,
	window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTING
   FRONT + BACKLIGHTS
   ================================================== */

/*
   Front light:
   gives the letters a readable clay form.
*/

const frontLight = new THREE.DirectionalLight(
	0xffffff,
	3.2
);

frontLight.position.set(
	0,
	1.5,
	8
);

scene.add(frontLight);


/*
   Soft environment fill.
*/

const hemi = new THREE.HemisphereLight(
	0xfff7ec,
	0x554e6b,
	1.45
);

scene.add(hemi);


/*
   Left cool rim/back light.
*/

const backLeft = new THREE.DirectionalLight(
	0x7897ff,
	2.8
);

backLeft.position.set(
	-5,
	2.5,
	-5
);

scene.add(backLeft);


/*
   Right warm rim/back light.
*/

const backRight = new THREE.DirectionalLight(
	0xff8cb9,
	2.5
);

backRight.position.set(
	5,
	-1.5,
	-4
);

scene.add(backRight);


/*
   A subtle moving side light.
   It reacts slightly to the cursor and helps
   reveal that the letters are really 3D.
*/

const cursorLight = new THREE.PointLight(
	0xffffff,
	5.0,
	20
);

cursorLight.position.set(
	0,
	0,
	5
);

scene.add(cursorLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2(0, 0);
const smoothPointer = new THREE.Vector2(0, 0);

window.addEventListener(
	"pointermove",
	(event) => {

		pointer.x =
			(event.clientX / window.innerWidth) * 2 - 1;

		pointer.y =
			-(
				(event.clientY / window.innerHeight) * 2 - 1
			);
	},
	{ passive: true }
);

window.addEventListener(
	"pointerleave",
	() => {
		pointer.set(0, 0);
	}
);


/* ==================================================
   MODEL REFERENCES
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topPupil = null;
let botPupil = null;

const interactiveItems = [];


/* ==================================================
   HELPERS
   ================================================== */

function findAny(root, names) {

	for (const name of names) {

		const object = root.getObjectByName(name);

		if (object) {
			return object;
		}
	}

	return null;
}


function rememberBase(object) {

	if (!object) return;

	object.userData.basePosition =
		object.position.clone();

	object.userData.baseRotation =
		object.rotation.clone();

	object.userData.phase =
		Math.random() * Math.PI * 2;

	object.userData.floatAmp =
		0.008 + Math.random() * 0.012;
}


function addInteractive(object) {

	if (!object) return;

	rememberBase(object);

	if (!interactiveItems.includes(object)) {
		interactiveItems.push(object);
	}
}


/* ==================================================
   CAMERA FRAMING
   ================================================== */

function frameObject(object) {

	const box = new THREE.Box3().setFromObject(object);

	const size = new THREE.Vector3();
	const center = new THREE.Vector3();

	box.getSize(size);
	box.getCenter(center);

	/*
	   Center the whole logo around the scene origin.
	*/
	object.position.sub(center);

	const maxDim = Math.max(
		size.x,
		size.y,
		size.z
	);

	const fov =
		THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim /
		(2 * Math.tan(fov / 2));

	distance *= 1.25;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near =
		Math.max(0.01, distance / 100);

	camera.far =
		distance * 100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD GLB
   ================================================== */

const loader = new GLTFLoader();

loader.load(

	"./Name1.glb",

	(gltf) => {

		model = gltf.scene;

		/*
		   IMPORTANT:
		   Previous version used -90°.
		   This one uses +90° because your screenshot
		   showed the logo flipped to the wrong side.
		*/

		model.rotation.x =
			Math.PI / 2;

		scene.add(model);


		model.traverse(
			(object) => {

				if (
					object.isMesh &&
					object.material
				) {
					object.material.needsUpdate = true;
				}
			}
		);


		topControl = findAny(
			model,
			[
				"O_TOP_CONTROL",
				"O.Top.Control",
				"O_TOP_CTRL"
			]
		);

		botControl = findAny(
			model,
			[
				"O_BOT_CONTROL",
				"O.Bot.Control",
				"O_BOT_CTRL"
			]
		);

		topPupil = findAny(
			model,
			[
				"O.Top.Pupil",
				"O_TOP_PUPIL",
				"Pupil.Top"
			]
		);

		botPupil = findAny(
			model,
			[
				"O.Bot.Pupil",
				"O_BOT_PUPIL",
				"Pupil.Bot"
			]
		);


		const regularLetters = [
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		];

		regularLetters.forEach(
			(name) => {

				addInteractive(
					model.getObjectByName(name)
				);
			}
		);


		/*
		   The O groups react as whole objects.
		*/
		addInteractive(topControl);
		addInteractive(botControl);


		if (topPupil) {
			rememberBase(topPupil);
		}

		if (botPupil) {
			rememberBase(botPupil);
		}


		frameObject(model);

		console.log("Logo loaded:", model);
		console.log("Top pupil:", topPupil);
		console.log("Bottom pupil:", botPupil);
	},

	undefined,

	(error) => {

		console.error(error);

		document.querySelector(
			".hint"
		).textContent =
			"Could not load Name1.glb";
	}
);


/* ==================================================
   EYE MOVEMENT
   ================================================== */

/*
   With +90° X correction, the visual plane
   still behaves as local X / Z.
*/

function updatePupil(
	pupil,
	control,
	strength = 1
) {

	if (
		!pupil ||
		!pupil.userData.basePosition
	) {
		return;
	}

	const base =
		pupil.userData.basePosition;

	const maxX = 0.060;
	const maxZ = 0.045;

	let targetX =
		smoothPointer.x * maxX;

	let targetZ =
		-smoothPointer.y * maxZ;

	const nx =
		targetX / maxX;

	const nz =
		targetZ / maxZ;

	const length =
		Math.sqrt(
			nx * nx +
			nz * nz
		);

	if (length > 1) {

		targetX /= length;
		targetZ /= length;
	}

	pupil.position.x +=
		(
			base.x +
			targetX -
			pupil.position.x
		) * 0.17;

	pupil.position.z +=
		(
			base.z +
			targetZ -
			pupil.position.z
		) * 0.17;


	const pressure =
		THREE.MathUtils.smoothstep(
			length,
			0.70,
			1.0
		);

	if (
		control &&
		control.userData.basePosition &&
		control.userData.baseRotation
	) {

		const bp =
			control.userData.basePosition;

		const br =
			control.userData.baseRotation;


		/*
		   More visible "bump" when the pupil
		   approaches the edge.
		*/

		const targetRotY =
			br.y
			-
			smoothPointer.x
			*
			pressure
			*
			0.11
			*
			strength;


		const targetRotX =
			br.x
			+
			smoothPointer.y
			*
			pressure
			*
			0.055
			*
			strength;


		control.rotation.y +=
			(
				targetRotY -
				control.rotation.y
			) * 0.08;


		control.rotation.x +=
			(
				targetRotX -
				control.rotation.x
			) * 0.08;


		control.position.x +=
			(
				bp.x
				+
				smoothPointer.x
				*
				pressure
				*
				0.018
				-
				control.position.x
			) * 0.065;


		control.position.z +=
			(
				bp.z
				-
				smoothPointer.y
				*
				pressure
				*
				0.014
				-
				control.position.z
			) * 0.065;
	}
}


/* ==================================================
   LETTER REPULSION
   ================================================== */

/*
   Mouse now behaves like a magnetic repeller.

   The closer it gets to a letter:
   - letter moves away from the cursor
   - pushes a little toward / away in depth
   - rotates more aggressively
   - nearby letters also receive some influence
*/

const tempWorld = new THREE.Vector3();
const tempScreen = new THREE.Vector3();

function updateLetters(time) {

	interactiveItems.forEach(
		(object, index) => {

			if (
				!object.userData.basePosition ||
				!object.userData.baseRotation
			) {
				return;
			}

			const basePosition =
				object.userData.basePosition;

			const baseRotation =
				object.userData.baseRotation;

			const phase =
				object.userData.phase;


			/* --------------------------------------
			   ZERO-GRAVITY IDLE
			   -------------------------------------- */

			const idleX =
				Math.cos(
					time * 0.38 + phase
				)
				*
				object.userData.floatAmp
				*
				0.50;


			const idleZ =
				Math.sin(
					time * 0.50 + phase
				)
				*
				object.userData.floatAmp;


			const idleY =
				Math.sin(
					time * 0.31 +
					phase * 0.8
				)
				*
				object.userData.floatAmp
				*
				0.30;


			/* --------------------------------------
			   OBJECT POSITION IN SCREEN SPACE
			   -------------------------------------- */

			object.getWorldPosition(tempWorld);

			tempScreen
				.copy(tempWorld)
				.project(camera);


			const dx =
				tempScreen.x -
				smoothPointer.x;

			const dy =
				tempScreen.y -
				smoothPointer.y;


			const distance =
				Math.sqrt(
					dx * dx +
					dy * dy
				);


			/*
			   Slightly larger radius than before,
			   so the cursor can push letters
			   while travelling between them.
			*/

			const radius = 0.34;


			let influence =
				1 - (distance / radius);


			influence =
				THREE.MathUtils.clamp(
					influence,
					0,
					1
				);


			/*
			   Strong center, soft edge.
			*/

			influence =
				influence *
				influence *
				(3 - 2 * influence);


			let dirX = dx;
			let dirY = dy;

			const dirLength =
				Math.sqrt(
					dirX * dirX +
					dirY * dirY
				) || 1;


			dirX /= dirLength;
			dirY /= dirLength;


			/*
			   Stronger repulsion.
			*/

			const push =
				influence * 0.085;


			const targetX =
				basePosition.x
				+
				idleX
				+
				dirX * push;


			const targetZ =
				basePosition.z
				+
				idleZ
				-
				dirY * push;


			/*
			   Depth movement makes the effect
			   look more 3D instead of just 2D.
			*/

			const targetY =
				basePosition.y
				+
				idleY
				+
				influence * 0.045;


			object.position.x +=
				(
					targetX -
					object.position.x
				) * 0.09;


			object.position.z +=
				(
					targetZ -
					object.position.z
				) * 0.09;


			object.position.y +=
				(
					targetY -
					object.position.y
				) * 0.075;


			/* --------------------------------------
			   STRONGER 3D ROTATION
			   -------------------------------------- */

			const targetRotY =
				baseRotation.y
				+
				dirX
				*
				influence
				*
				0.22
				+
				Math.sin(
					time * 0.36 + phase
				) * 0.018;


			const targetRotX =
				baseRotation.x
				+
				dirY
				*
				influence
				*
				0.16
				+
				Math.cos(
					time * 0.32 + phase
				) * 0.012;


			const targetRotZ =
				baseRotation.z
				-
				dirX
				*
				dirY
				*
				influence
				*
				0.15;


			object.rotation.y +=
				(
					targetRotY -
					object.rotation.y
				) * 0.075;


			object.rotation.x +=
				(
					targetRotX -
					object.rotation.x
				) * 0.075;


			object.rotation.z +=
				(
					targetRotZ -
					object.rotation.z
				) * 0.065;
		}
	);
}


/* ==================================================
   CURSOR LIGHT
   ================================================== */

function updateCursorLight() {

	/*
	   The light moves laterally with the cursor.
	   It makes the clay highlights travel over
	   the forms and reveals the rotations.
	*/

	cursorLight.position.x +=
		(
			smoothPointer.x * 4.0 -
			cursorLight.position.x
		) * 0.06;


	cursorLight.position.y +=
		(
			smoothPointer.y * 2.5 -
			cursorLight.position.y
		) * 0.06;


	cursorLight.position.z = 5.0;
}


/* ==================================================
   ANIMATION LOOP
   ================================================== */

const clock = new THREE.Clock();

function animate() {

	requestAnimationFrame(animate);

	const time =
		clock.getElapsedTime();


	smoothPointer.lerp(
		pointer,
		0.075
	);


	if (model) {

		updateLetters(time);

		updatePupil(
			topPupil,
			topControl,
			1.0
		);

		updatePupil(
			botPupil,
			botControl,
			0.92
		);
	}


	updateCursorLight();


	renderer.render(
		scene,
		camera
	);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			window.innerWidth /
			window.innerHeight;

		camera.updateProjectionMatrix();

		renderer.setSize(
			window.innerWidth,
			window.innerHeight
		);
	}
);

</script>

</body>
</html>
