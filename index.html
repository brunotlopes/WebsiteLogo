<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes — 3D Logo</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.status {
		position: absolute;
		left: 14px;
		bottom: 12px;
		font: 11px/1.2 Arial, sans-serif;
		opacity: .28;
		pointer-events: none;
		user-select: none;
	}
</style>
</head>

<body>

<div id="app">
	<div class="status" id="status">loading…</div>
</div>


<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");
const status = document.querySelector("#status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true
});

renderer.setPixelRatio(
	Math.min(devicePixelRatio, 2)
);

renderer.setSize(
	innerWidth,
	innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTING
   ================================================== */

/* front fill */
const frontLight = new THREE.DirectionalLight(
	0xffffff,
	3.0
);

frontLight.position.set(
	0,
	1,
	8
);

scene.add(frontLight);


/* ambient fill */
const hemiLight = new THREE.HemisphereLight(
	0xfff5e8,
	0x4b4860,
	1.25
);

scene.add(hemiLight);


/* cool backlight */
const rimBlue = new THREE.DirectionalLight(
	0x7895ff,
	2.5
);

rimBlue.position.set(
	-5,
	3,
	-5
);

scene.add(rimBlue);


/* warm backlight */
const rimPink = new THREE.DirectionalLight(
	0xff8cb6,
	2.2
);

rimPink.position.set(
	5,
	-2,
	-5
);

scene.add(rimPink);


/* subtle light that follows the pointer */
const cursorLight = new THREE.PointLight(
	0xffffff,
	3.8,
	20
);

cursorLight.position.set(
	0,
	0,
	5
);

scene.add(cursorLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2(0, 0);
const smoothPointer = new THREE.Vector2(0, 0);

window.addEventListener(
	"pointermove",
	(event) => {

		pointer.x =
			(event.clientX / innerWidth) * 2 - 1;

		pointer.y =
			-(
				(event.clientY / innerHeight) * 2 - 1
			);
	},
	{ passive: true }
);

window.addEventListener(
	"pointerleave",
	() => {
		pointer.set(0, 0);
	}
);


/* ==================================================
   MODEL REFERENCES
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topPupil = null;
let botPupil = null;

let topWhite = null;
let botWhite = null;

const bodies = [];

let logoWidth = 1;
let logoHeight = 1;


/* ==================================================
   HELPERS
   ================================================== */

function get(name) {
	return model
		? model.getObjectByName(name)
		: null;
}


function saveBase(object) {

	object.userData.basePosition =
		object.position.clone();

	object.userData.baseRotation =
		object.rotation.clone();

	object.userData.velocity =
		new THREE.Vector3(
			THREE.MathUtils.randFloatSpread(0.002),
			THREE.MathUtils.randFloatSpread(0.001),
			THREE.MathUtils.randFloatSpread(0.002)
		);

	object.userData.angularVelocity =
		new THREE.Vector3(
			THREE.MathUtils.randFloatSpread(0.001),
			THREE.MathUtils.randFloatSpread(0.001),
			THREE.MathUtils.randFloatSpread(0.001)
		);

	object.userData.phase =
		Math.random() * Math.PI * 2;
}


function addBody(object) {

	if (!object) return;

	saveBase(object);

	const box =
		new THREE.Box3()
			.setFromObject(object);

	const size =
		new THREE.Vector3();

	box.getSize(size);

	/*
	   Soft collision radius.
	   X/Z are the logo plane in Blender-local space.
	*/
	object.userData.radius =
		Math.max(
			size.x,
			size.y
		) * 0.34;

	bodies.push(object);
}


/* ==================================================
   FRAME MODEL
   ================================================== */

function frameModel() {

	const box =
		new THREE.Box3()
			.setFromObject(model);

	const center =
		new THREE.Vector3();

	const size =
		new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	model.position.sub(center);

	const centeredBox =
		new THREE.Box3()
			.setFromObject(model);

	centeredBox.getSize(size);

	logoWidth = size.x;
	logoHeight = size.y;

	const maxDim =
		Math.max(
			size.x,
			size.y
		);

	const fov =
		THREE.MathUtils.degToRad(
			camera.fov
		);

	let distance =
		maxDim /
		(
			2 *
			Math.tan(fov / 2)
		);

	distance *= 1.50;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near =
		Math.max(
			0.01,
			distance / 100
		);

	camera.far =
		distance * 100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD GLB
   ================================================== */

const loader = new GLTFLoader();

loader.load(

	"./Name1.glb",

	(gltf) => {

		model =
			gltf.scene;


		/*
		   Correct orientation for this exported Blender file.
		*/
		model.rotation.x =
			Math.PI / 2;

		scene.add(model);


		/* NEW, CORRECT HIERARCHY */
		topControl =
			get("O_TOP_CONTROL");

		botControl =
			get("O_BOT_CONTROL");

		topWhite =
			get("O.Top.White");

		botWhite =
			get("O.Bot.White");

		topPupil =
			get("O.Top.Pupil");

		botPupil =
			get("O.Bot.Pupil");


		/*
		   Regular letters.
		*/
		[
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		].forEach(
			(name) => {
				addBody(
					get(name)
				);
			}
		);


		/*
		   Each O is one floating body.
		   White + pupil are already children
		   of the control in the corrected GLB.
		*/
		addBody(topControl);
		addBody(botControl);


		if (topPupil) {
			saveBase(topPupil);
		}

		if (botPupil) {
			saveBase(botPupil);
		}


		frameModel();


		status.textContent =
			`eyes ${topPupil ? "✓" : "✗"} ${botPupil ? "✓" : "✗"} • zero gravity`;


		console.log(
			"TOP:",
			topControl,
			topWhite,
			topPupil
		);

		console.log(
			"BOT:",
			botControl,
			botWhite,
			botPupil
		);
	},

	undefined,

	(error) => {

		console.error(error);

		status.textContent =
			"could not load Name1.glb";
	}
);


/* ==================================================
   EYES
   ================================================== */

/*
   With the corrected GLB hierarchy this is simple:

   pupil is a direct child of the O control.

   We calculate where the eye is on screen,
   then move the pupil toward the cursor.
*/

const eyeScreen =
	new THREE.Vector3();

function updateEye(
	pupil,
	control
) {

	if (
		!pupil ||
		!control ||
		!pupil.userData.basePosition
	) {
		return;
	}


	control.getWorldPosition(
		eyeScreen
	);

	eyeScreen.project(
		camera
	);


	let dx =
		smoothPointer.x -
		eyeScreen.x;

	let dy =
		smoothPointer.y -
		eyeScreen.y;


	/*
	   Cursor distance needed for pupil to
	   reach the edge of the eye.
	*/
	const gazeDistance =
		0.42;


	dx =
		THREE.MathUtils.clamp(
			dx / gazeDistance,
			-1,
			1
		);


	dy =
		THREE.MathUtils.clamp(
			dy / gazeDistance,
			-1,
			1
		);


	const length =
		Math.sqrt(
			dx * dx +
			dy * dy
		);


	if (length > 1) {

		dx /= length;
		dy /= length;
	}


	const base =
		pupil.userData.basePosition;


	/*
	   IMPORTANT:
	   in the new GLB the pupil and white have
	   matching X/Z centers and Y is depth.

	   So:
	   X = screen horizontal
	   Z = screen vertical
	*/

	const maxX =
		0.075;

	const maxZ =
		0.060;


	const targetX =
		base.x +
		dx * maxX;


	const targetZ =
		base.z -
		dy * maxZ;


	pupil.position.x +=
		(
			targetX -
			pupil.position.x
		) * 0.30;


	pupil.position.z +=
		(
			targetZ -
			pupil.position.z
		) * 0.30;
}


/* ==================================================
   TRUE ZERO-GRAVITY PHYSICS
   ================================================== */

/*
   There is NO spring back to BRUNO LOPES.

   Each letter has:
   - velocity
   - very small drag
   - mouse repulsion
   - collisions
   - invisible boundaries
   - tiny random drift

   Once pushed, it keeps drifting.
*/

const tempWorld =
	new THREE.Vector3();

const tempScreen =
	new THREE.Vector3();


function applyForces(time) {

	for (
		const body
		of bodies
	) {

		const velocity =
			body.userData.velocity;

		const angularVelocity =
			body.userData.angularVelocity;


		/* -----------------------------------------
		   VERY GENTLE SPACE DRIFT
		   ----------------------------------------- */

		const phase =
			body.userData.phase;


		velocity.x +=
			Math.sin(
				time * 0.27 +
				phase
			) * 0.000055;


		velocity.z +=
			Math.cos(
				time * 0.23 +
				phase * 1.3
			) * 0.000065;


		velocity.y +=
			Math.sin(
				time * 0.18 +
				phase * 0.7
			) * 0.000020;



		/* -----------------------------------------
		   MOUSE REPULSOR
		   ----------------------------------------- */

		body.getWorldPosition(
			tempWorld
		);

		tempScreen
			.copy(tempWorld)
			.project(camera);


		const dx =
			tempScreen.x -
			smoothPointer.x;


		const dy =
			tempScreen.y -
			smoothPointer.y;


		const distance =
			Math.sqrt(
				dx * dx +
				dy * dy
			);


		/*
		   Wide enough that moving between letters
		   pushes neighbouring pieces.
		*/
		const radius =
			0.32;


		let influence =
			THREE.MathUtils.clamp(
				1 -
				distance /
				radius,
				0,
				1
			);


		influence *=
			influence;


		if (
			influence > 0
		) {

			const safeDistance =
				distance || 0.001;


			const dirX =
				dx /
				safeDistance;


			const dirY =
				dy /
				safeDistance;


			/*
			   Moderate impulse.
			*/
			const force =
				influence *
				0.0019;


			velocity.x +=
				dirX *
				force;


			/*
			   Screen Y maps to local Z
			   with opposite sign.
			*/
			velocity.z -=
				dirY *
				force;


			/*
			   Small depth kick.
			*/
			velocity.y +=
				influence *
				0.00045;


			/*
			   Give the object a real 3D tumble.
			*/
			angularVelocity.x +=
				dirY *
				influence *
				0.0013;


			angularVelocity.y +=
				dirX *
				influence *
				0.0020;


			angularVelocity.z +=
				(
					dirX -
					dirY
				)
				*
				influence
				*
				0.0010;
		}


		/* -----------------------------------------
		   SPEED LIMITS
		   ----------------------------------------- */

		const maxSpeed =
			0.012;


		const speed =
			velocity.length();


		if (
			speed >
			maxSpeed
		) {

			velocity.multiplyScalar(
				maxSpeed /
				speed
			);
		}


		const maxAngular =
			0.016;


		const angularSpeed =
			angularVelocity.length();


		if (
			angularSpeed >
			maxAngular
		) {

			angularVelocity.multiplyScalar(
				maxAngular /
					angularSpeed
			);
		}
	}
}


/* ==================================================
   LETTER COLLISIONS
   ================================================== */

/*
   Soft, momentum-like collisions.
   Letters cannot simply pass through each other.
*/

function solveCollisions() {

	for (
		let i = 0;
		i < bodies.length;
		i++
	) {

		const a =
			bodies[i];


		for (
			let j = i + 1;
			j < bodies.length;
			j++
		) {

			const b =
				bodies[j];


			let dx =
				b.position.x -
				a.position.x;


			let dz =
				b.position.z -
				a.position.z;


			let distance =
				Math.sqrt(
					dx * dx +
					dz * dz
				);


			const minDistance =
				(
					a.userData.radius +
					b.userData.radius
				) * 0.76;


			if (
				distance <
				minDistance
			) {

				if (
					distance <
					0.0001
				) {

					distance =
						0.0001;

					dx =
						0.0001;
				}


				const nx =
					dx /
					distance;


				const nz =
					dz /
					distance;


				const overlap =
					minDistance -
					distance;


				/*
				   Separate the meshes.
				*/

				const correction =
					overlap *
					0.18;


				a.position.x -=
					nx *
					correction;


				a.position.z -=
					nz *
					correction;


				b.position.x +=
					nx *
					correction;


				b.position.z +=
					nz *
					correction;


				/*
				   Exchange a little momentum.
				*/

				const av =
					a.userData.velocity;


				const bv =
					b.userData.velocity;


				const relativeVelocity =
					(
						bv.x -
						av.x
					)
					*
					nx
					+
					(
						bv.z -
						av.z
					)
					*
					nz;


				if (
					relativeVelocity <
					0
				) {

					const impulse =
						-relativeVelocity *
						0.55;


					av.x -=
						nx *
						impulse;


					av.z -=
						nz *
						impulse;


					bv.x +=
						nx *
						impulse;


					bv.z +=
						nz *
						impulse;
				}


				/*
				   Small rotational bump.
				*/

				a.userData.angularVelocity.y -=
					overlap *
					0.002;


				b.userData.angularVelocity.y +=
					overlap *
					0.002;
			}
		}
	}
}


/* ==================================================
   INVISIBLE MENU BOUNDARIES
   ================================================== */

function solveBoundaries() {

	/*
	   Much larger than the original logo.
	   The letters can genuinely drift around,
	   but remain inside the menu area.
	*/

	const halfWidth =
		logoWidth *
		0.82;


	const halfHeight =
		logoHeight *
		1.15;


	for (
		const body
		of bodies
	) {

		const velocity =
			body.userData.velocity;


		if (
			body.position.x <
			-halfWidth
		) {

			body.position.x =
				-halfWidth;

			velocity.x =
				Math.abs(
					velocity.x
				) * 0.72;
		}


		if (
			body.position.x >
			halfWidth
		) {

			body.position.x =
				halfWidth;

			velocity.x =
				-Math.abs(
					velocity.x
				) * 0.72;
		}


		if (
			body.position.z <
			-halfHeight
		) {

			body.position.z =
				-halfHeight;

			velocity.z =
				Math.abs(
					velocity.z
				) * 0.72;
		}


		if (
			body.position.z >
			halfHeight
		) {

			body.position.z =
				halfHeight;

			velocity.z =
				-Math.abs(
					velocity.z
				) * 0.72;
		}


		/*
		   Keep depth movement controlled.
		*/

		const baseDepth =
			body.userData.basePosition.y;


		const depthRange =
			0.16;


		if (
			body.position.y <
			baseDepth -
			depthRange
		) {

			body.position.y =
				baseDepth -
				depthRange;

			velocity.y =
				Math.abs(
					velocity.y
				) * 0.65;
		}


		if (
			body.position.y >
			baseDepth +
			depthRange
		) {

			body.position.y =
				baseDepth +
				depthRange;

			velocity.y =
				-Math.abs(
					velocity.y
				) * 0.65;
		}
	}
}


/* ==================================================
   INTEGRATE
   ================================================== */

function integrateBodies() {

	for (
		const body
		of bodies
	) {

		const velocity =
			body.userData.velocity;


		const angularVelocity =
			body.userData.angularVelocity;


		/*
		   Very low drag = space feeling.

		   No spring.
		   No return to original position.
		*/

		velocity.multiplyScalar(
			0.992
		);


		angularVelocity.multiplyScalar(
			0.988
		);


		body.position.add(
			velocity
		);


		body.rotation.x +=
			angularVelocity.x;


		body.rotation.y +=
			angularVelocity.y;


		body.rotation.z +=
			angularVelocity.z;
	}
}


/* ==================================================
   CURSOR LIGHT
   ================================================== */

function updateCursorLight() {

	cursorLight.position.x +=
		(
			smoothPointer.x *
			4.5 -
			cursorLight.position.x
		) * 0.06;


	cursorLight.position.y +=
		(
			smoothPointer.y *
			3 -
			cursorLight.position.y
		) * 0.06;


	cursorLight.position.z =
		5;
}


/* ==================================================
   LOOP
   ================================================== */

const clock =
	new THREE.Clock();


function animate() {

	requestAnimationFrame(
		animate
	);


	const time =
		clock.getElapsedTime();


	smoothPointer.lerp(
		pointer,
		0.12
	);


	if (model) {

		applyForces(time);


		/*
		   Two passes gives stable soft collisions.
		*/
		solveCollisions();
		solveCollisions();


		integrateBodies();


		solveBoundaries();


		/*
		   Eyes AFTER physics.
		   Their movement remains relative to the
		   moving O control.
		*/
		updateEye(
			topPupil,
			topControl
		);


		updateEye(
			botPupil,
			botControl
		);
	}


	updateCursorLight();


	renderer.render(
		scene,
		camera
	);
}


animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			innerWidth /
			innerHeight;


		camera.updateProjectionMatrix();


		renderer.setSize(
			innerWidth,
			innerHeight
		);
	}
);

</script>

</body>
</html>
