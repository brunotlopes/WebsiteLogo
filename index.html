<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes 3D Logo</title>
<style>
html,body{
	margin:0;
	width:100%;
	height:100%;
	overflow:hidden;
	background:#fff4e0;
}
#app{
	position:relative;
	width:100%;
	height:100%;
	overflow:hidden;
}
canvas{
	display:block;
	width:100%;
	height:100%;
}
.hint{
	position:absolute;
	left:16px;
	bottom:14px;
	font:12px/1.2 Arial,sans-serif;
	opacity:.35;
	pointer-events:none;
}
</style>
</head>
<body>

<div id="app">
	<div class="hint" id="hint">loading…</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");
const hint = document.querySelector("#hint");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({ antialias:true });

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTS
   ================================================== */

const front = new THREE.DirectionalLight(0xffffff,3.2);
front.position.set(0,1,8);
scene.add(front);

const hemi = new THREE.HemisphereLight(
	0xfff5e8,
	0x514d66,
	1.35
);
scene.add(hemi);

const rimBlue = new THREE.DirectionalLight(0x7896ff,2.4);
rimBlue.position.set(-5,3,-5);
scene.add(rimBlue);

const rimPink = new THREE.DirectionalLight(0xff8eb7,2.2);
rimPink.position.set(5,-2,-5);
scene.add(rimPink);

const mouseLight = new THREE.PointLight(0xffffff,4.0,20);
mouseLight.position.set(0,0,5);
scene.add(mouseLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2();
const smoothPointer = new THREE.Vector2();

window.addEventListener("pointermove",(event)=>{
	pointer.x = (event.clientX / innerWidth) * 2 - 1;
	pointer.y = -(event.clientY / innerHeight) * 2 + 1;
},{passive:true});

window.addEventListener("pointerleave",()=>{
	pointer.set(0,0);
});


/* ==================================================
   MODEL REFERENCES
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topPupil = null;
let botPupil = null;

let topWhite = null;
let botWhite = null;

const letters = [];

let logoWidth = 1;
let logoHeight = 1;


/* ==================================================
   HELPERS
   ================================================== */

function get(name){
	return model ? model.getObjectByName(name) : null;
}

function rememberBase(object){

	object.userData.basePosition = object.position.clone();
	object.userData.baseRotation = object.rotation.clone();

	object.userData.phase = Math.random() * Math.PI * 2;
	object.userData.speedX = 0.20 + Math.random() * 0.16;
	object.userData.speedZ = 0.18 + Math.random() * 0.15;
	object.userData.speedY = 0.14 + Math.random() * 0.10;

	object.userData.repulsion = new THREE.Vector3();
	object.userData.collision = new THREE.Vector3();

	object.userData.rotOffset = new THREE.Vector3();
}

function normalizeEye(control,white,pupil){

	if(!control) return;

	/*
		Your exported eye hierarchy is asymmetrical.
		Attach both visible eye pieces directly to the control
		while keeping their world transforms.
	*/

	if(white){
		control.attach(white);
	}

	if(pupil){
		control.attach(pupil);
	}
}

function addLetter(object){

	if(!object) return;

	rememberBase(object);

	const box = new THREE.Box3().setFromObject(object);
	const size = new THREE.Vector3();

	box.getSize(size);

	/*
		Visual plane is X / Z in Blender local coordinates.
	*/
	object.userData.radius =
		Math.max(size.x,size.z) * 0.34;

	letters.push(object);
}


/* ==================================================
   FRAME
   ================================================== */

function frameModel(){

	const box = new THREE.Box3().setFromObject(model);
	const center = new THREE.Vector3();
	const size = new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	model.position.sub(center);

	const box2 = new THREE.Box3().setFromObject(model);
	box2.getSize(size);

	logoWidth = size.x;
	logoHeight = size.y;

	const maxDim = Math.max(size.x,size.y);

	const fov = THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim / (2 * Math.tan(fov / 2));

	distance *= 1.48;

	camera.position.set(0,0,distance);
	camera.near = Math.max(.01,distance/100);
	camera.far = distance * 100;
	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD
   ================================================== */

new GLTFLoader().load(
	"./Name1.glb",

	(gltf)=>{

		model = gltf.scene;

		/*
			This is the orientation that faces the camera.
		*/
		model.rotation.x = Math.PI / 2;

		scene.add(model);

		topControl = get("O_TOP_CONTROL");
		botControl = get("O_BOT_CONTROL");

		topWhite = get("O.Top.White");
		botWhite = get("O.Bot.White");

		topPupil = get("O.Top.Pupil");
		botPupil = get("O.Bot.Pupil");

		normalizeEye(
			topControl,
			topWhite,
			topPupil
		);

		normalizeEye(
			botControl,
			botWhite,
			botPupil
		);

		[
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		].forEach(name=>{
			addLetter(get(name));
		});

		addLetter(topControl);
		addLetter(botControl);

		if(topPupil) rememberBase(topPupil);
		if(botPupil) rememberBase(botPupil);

		frameModel();

		hint.textContent =
			`eyes: ${topPupil ? "✓" : "✗"} ${botPupil ? "✓" : "✗"} • move the mouse`;

		console.log("TOP CONTROL",topControl);
		console.log("TOP PUPIL",topPupil);
		console.log("BOT CONTROL",botControl);
		console.log("BOT PUPIL",botPupil);
	},

	undefined,

	(error)=>{
		console.error(error);
		hint.textContent = "could not load Name1.glb";
	}
);


/* ==================================================
   EYES
   REAL RAY / PLANE TRACKING
   ================================================== */

const raycaster = new THREE.Raycaster();

const eyeWorld = new THREE.Vector3();
const hitWorld = new THREE.Vector3();
const cameraDirection = new THREE.Vector3();

const eyePlane = new THREE.Plane();

function updateEye(pupil,control){

	if(
		!pupil ||
		!control ||
		!pupil.userData.basePosition
	){
		return;
	}

	/*
		1. Shoot a ray from the camera through the mouse.
	*/

	raycaster.setFromCamera(
		smoothPointer,
		camera
	);

	/*
		2. Make a plane through THIS eye,
		   always facing the camera.
	*/

	control.getWorldPosition(eyeWorld);

	camera.getWorldDirection(cameraDirection);

	eyePlane.setFromNormalAndCoplanarPoint(
		cameraDirection,
		eyeWorld
	);

	const hit =
		raycaster.ray.intersectPlane(
			eyePlane,
			hitWorld
		);

	if(!hit) return;


	/*
		3. Convert cursor hit point into the eye control's
		   LOCAL coordinates.

		   This removes all ambiguity caused by Blender /
		   glTF axis conversion.
	*/

	const localHit =
		control.worldToLocal(
			hitWorld.clone()
		);


	/*
		In your GLB:
		X = horizontal across eye
		Z = vertical across eye
		Y = depth
	*/

	let dx = localHit.x;
	let dz = localHit.z;


	/*
		Normalize direction.
	*/

	const distance =
		Math.sqrt(
			dx*dx +
			dz*dz
		) || 0.0001;

	dx /= distance;
	dz /= distance;


	/*
		Large enough to be VERY visible.
	*/

	const maxX = 0.115;
	const maxZ = 0.095;


	const base =
		pupil.userData.basePosition;


	const targetX =
		base.x +
		dx * maxX;


	const targetZ =
		base.z +
		dz * maxZ;


	pupil.position.x +=
		(targetX - pupil.position.x)
		* 0.28;


	pupil.position.z +=
		(targetZ - pupil.position.z)
		* 0.28;


	/*
		The O gets a tiny reaction when the pupil
		is pressing toward an edge.
	*/

	const br =
		control.userData.baseRotation;

	if(br){

		const targetRy =
			br.y -
			dx * 0.055;

		const targetRx =
			br.x +
			dz * 0.035;

		control.rotation.y +=
			(targetRy - control.rotation.y)
			* 0.05;

		control.rotation.x +=
			(targetRx - control.rotation.x)
			* 0.05;
	}
}


/* ==================================================
   CALM FLOAT
   NO SPRING
   ================================================== */

const tempWorld = new THREE.Vector3();
const tempScreen = new THREE.Vector3();

function updateLetterTargets(time){

	for(const letter of letters){

		const base =
			letter.userData.basePosition;

		const phase =
			letter.userData.phase;


		/*
			Bounded drifting target.

			This is NOT a spring.
			No velocity overshoot.
			The letter simply follows a slowly wandering position.
		*/

		const driftX =
			Math.sin(
				time *
				letter.userData.speedX +
				phase
			)
			*
			logoWidth
			*
			0.022;


		const driftZ =
			Math.cos(
				time *
				letter.userData.speedZ +
				phase * 1.3
			)
			*
			logoHeight
			*
			0.026;


		const driftY =
			Math.sin(
				time *
				letter.userData.speedY +
				phase * .7
			)
			*
			0.04;


		/*
			Mouse repulsion offset.
		*/

		letter.getWorldPosition(tempWorld);
		tempScreen.copy(tempWorld).project(camera);

		const dx =
			tempScreen.x -
			smoothPointer.x;

		const dy =
			tempScreen.y -
			smoothPointer.y;

		const distance =
			Math.sqrt(dx*dx + dy*dy);

		const radius = 0.34;

		let influence =
			THREE.MathUtils.clamp(
				1 - distance/radius,
				0,
				1
			);

		influence *= influence;


		const repulsion =
			letter.userData.repulsion;


		let targetRepX = 0;
		let targetRepZ = 0;
		let targetRepY = 0;


		if(influence > 0){

			const safe =
				distance || 0.001;

			const dirX =
				dx / safe;

			const dirY =
				dy / safe;

			targetRepX =
				dirX *
				influence *
				logoWidth *
				0.055;

			targetRepZ =
				-dirY *
				influence *
				logoHeight *
				0.060;

			targetRepY =
				influence *
				0.08;


			/*
				More obvious 3D rotation near mouse.
			*/

			letter.userData.rotOffset.x +=
				(
					dirY * influence * 0.18 -
					letter.userData.rotOffset.x
				) * 0.08;

			letter.userData.rotOffset.y +=
				(
					dirX * influence * 0.25 -
					letter.userData.rotOffset.y
				) * 0.08;

			letter.userData.rotOffset.z +=
				(
					(dirX-dirY) *
					influence *
					0.12 -
					letter.userData.rotOffset.z
				) * 0.07;
		}
		else{

			letter.userData.rotOffset.multiplyScalar(
				0.94
			);
		}


		/*
			Repulsion decays smoothly.
			Again: no spring / no bounce.
		*/

		repulsion.x +=
			(targetRepX - repulsion.x)
			* 0.12;

		repulsion.z +=
			(targetRepZ - repulsion.z)
			* 0.12;

		repulsion.y +=
			(targetRepY - repulsion.y)
			* 0.10;


		const collision =
			letter.userData.collision;


		const targetX =
			base.x +
			driftX +
			repulsion.x +
			collision.x;


		const targetZ =
			base.z +
			driftZ +
			repulsion.z +
			collision.z;


		const targetY =
			base.y +
			driftY +
			repulsion.y;


		/*
			Exponential smoothing instead of physical spring.
		*/

		letter.position.x +=
			(targetX - letter.position.x)
			* 0.055;

		letter.position.z +=
			(targetZ - letter.position.z)
			* 0.055;

		letter.position.y +=
			(targetY - letter.position.y)
			* 0.050;


		/*
			Collision offset slowly disappears.
		*/

		collision.multiplyScalar(0.91);


		const br =
			letter.userData.baseRotation;

		const ro =
			letter.userData.rotOffset;


		const idleRX =
			Math.sin(
				time * .25 + phase
			) * .035;


		const idleRY =
			Math.cos(
				time * .22 + phase
			) * .045;


		const idleRZ =
			Math.sin(
				time * .19 + phase * 1.4
			) * .028;


		letter.rotation.x +=
			(
				br.x +
				idleRX +
				ro.x -
				letter.rotation.x
			)
			* 0.045;


		letter.rotation.y +=
			(
				br.y +
				idleRY +
				ro.y -
				letter.rotation.y
			)
			* 0.045;


		letter.rotation.z +=
			(
				br.z +
				idleRZ +
				ro.z -
				letter.rotation.z
			)
			* 0.045;
	}
}


/* ==================================================
   SOFT COLLISIONS
   ================================================== */

function solveCollisions(){

	for(let i=0;i<letters.length;i++){

		const a = letters[i];

		for(let j=i+1;j<letters.length;j++){

			const b = letters[j];

			const dx =
				b.position.x -
				a.position.x;

			const dz =
				b.position.z -
				a.position.z;

			let distance =
				Math.sqrt(
					dx*dx +
					dz*dz
				);

			const minDistance =
				(
					a.userData.radius +
					b.userData.radius
				)
				* 0.72;

			if(
				distance <
				minDistance
			){

				if(distance < 0.0001){
					distance = 0.0001;
				}

				const nx = dx/distance;
				const nz = dz/distance;

				const overlap =
					minDistance -
					distance;

				/*
					Push target offsets apart.
					No bounce impulse.
				*/

				const push =
					overlap * 0.055;

				a.userData.collision.x -=
					nx * push;

				a.userData.collision.z -=
					nz * push;

				b.userData.collision.x +=
					nx * push;

				b.userData.collision.z +=
					nz * push;
			}
		}
	}
}


/* ==================================================
   LIGHT FOLLOWS MOUSE
   ================================================== */

function updateMouseLight(){

	mouseLight.position.x +=
		(
			smoothPointer.x * 4.5 -
			mouseLight.position.x
		) * 0.06;

	mouseLight.position.y +=
		(
			smoothPointer.y * 3 -
			mouseLight.position.y
		) * 0.06;

	mouseLight.position.z = 5;
}


/* ==================================================
   LOOP
   ================================================== */

const clock = new THREE.Clock();

function animate(){

	requestAnimationFrame(animate);

	const time =
		clock.getElapsedTime();

	smoothPointer.lerp(
		pointer,
		0.12
	);

	if(model){

		/*
			First determine calm target movement,
			then resolve overlap.
		*/

		updateLetterTargets(time);

		solveCollisions();
		solveCollisions();

		/*
			Eyes last, so tracking isn't overwritten.
		*/

		updateEye(
			topPupil,
			topControl
		);

		updateEye(
			botPupil,
			botControl
		);
	}

	updateMouseLight();

	renderer.render(
		scene,
		camera
	);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener("resize",()=>{

	camera.aspect =
		innerWidth /
		innerHeight;

	camera.updateProjectionMatrix();

	renderer.setSize(
		innerWidth,
		innerHeight
	);
});

</script>
</body>
</html>
