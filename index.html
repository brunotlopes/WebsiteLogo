<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruno Lopes — A/B Material + Motion Lab</title>

<style>
html,body{
	margin:0;
	width:100%;
	height:100%;
	overflow:hidden;
	background:#fff4e0;
	font-family:Arial,sans-serif;
}
.site{position:relative;width:100%;height:100%;background:#fff4e0}
.sidebar{position:absolute;left:0;top:0;width:420px;height:100%}
.logo-slot{position:absolute;left:52px;top:44px;width:310px;height:205px}
.logo-slot canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.eye-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.dom-pupil{
	position:absolute;
	width:12px;height:12px;
	transform:translate(-50%,-50%);
	pointer-events:none;
	will-change:left,top,transform,width,height,border-radius,filter;
	background:
		radial-gradient(circle at 32% 28%,rgba(255,255,255,.92) 0 7%,transparent 8%),
		radial-gradient(circle at 58% 62%,#181818 0 38%,#050505 72%,#000 100%);
	border-radius:58% 42% 55% 45% / 46% 57% 43% 54%;
	box-shadow:
		inset 1px 1px 2px rgba(255,255,255,.10),
		inset -2px -2px 3px rgba(0,0,0,.45),
		0 1px 1px rgba(0,0,0,.14);
}
.fake-menu{
	position:absolute;left:68px;top:258px;
	font-size:16px;line-height:2.35;opacity:.68;pointer-events:none
}
.fake-menu b{display:block;font-size:19px;margin-bottom:6px}
.fake-content{
	position:absolute;left:470px;right:55px;top:55px;height:calc(100% - 110px);
	border:2px solid rgba(0,0,0,.68);border-radius:36px;opacity:.16;pointer-events:none
}
.panel{
	position:absolute;top:12px;right:12px;width:318px;max-height:calc(100vh - 24px);
	overflow:auto;box-sizing:border-box;padding:14px;
	background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.12);
	border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);
	backdrop-filter:blur(10px);z-index:20
}
.panel h3{margin:0 0 10px;font-size:13px}
.ab{
	display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px
}
.ab button{
	border:1px solid rgba(0,0,0,.16);background:#f6f6f6;border-radius:9px;
	padding:9px 8px;font-size:11px;font-weight:700;cursor:pointer
}
.ab button.active{background:#111;color:#fff}
.section-title{
	margin:11px 0 5px;padding-top:8px;border-top:1px solid rgba(0,0,0,.1);
	font-size:10px;font-weight:700;letter-spacing:.05em;opacity:.55
}
.row{
	display:grid;grid-template-columns:118px 1fr 48px;gap:7px;align-items:center;margin:5px 0
}
.row label{font-size:11px;opacity:.72}
.row input[type="range"]{width:100%}
.val{font-size:10px;text-align:right;opacity:.62}
.check{margin-top:7px;font-size:11px;display:flex;align-items:center;gap:7px}
.smallnote{font-size:10px;line-height:1.35;opacity:.52;margin:7px 0 2px}
.status{position:absolute;left:14px;bottom:12px;font-size:11px;opacity:.35;z-index:20}
</style>
</head>

<body>
<div class="site">
	<div class="sidebar">
		<div class="logo-slot" id="logoSlot">
			<div class="eye-layer">
				<div class="dom-pupil" id="topPupil"></div>
				<div class="dom-pupil" id="botPupil"></div>
			</div>
		</div>

		<div class="fake-menu">
			<b>MOTION GRAPHICS * VFX</b>
			Showreel<br>Playground<br>Futster<br>Gobelins JPO<br>Universal Music France<br>Museum D'Orsay
		</div>
	</div>

	<div class="fake-content"></div>

	<div class="panel">
		<h3>A/B logo lab</h3>

		<div class="ab">
			<button id="modeA" class="active">A — SOFT PBR</button>
			<button id="modeB">B — MATCAP</button>
		</div>

		<div class="smallnote">
			A and B keep separate settings. Switch anytime and tune each profile independently.
		</div>

		<div class="section-title">GLOBAL</div>
		<div class="row"><label>Logo zoom</label><input id="zoom" type="range" min=".75" max="1.8" step=".01"><span class="val" id="zoomVal"></span></div>
		<div class="row"><label>Exposure</label><input id="exposure" type="range" min=".2" max="2" step=".01"><span class="val" id="exposureVal"></span></div>

		<div class="section-title">MATERIAL</div>
		<div class="row"><label>Normal</label><input id="normal" type="range" min="0" max="3" step=".01"><span class="val" id="normalVal"></span></div>
		<div class="row"><label>Roughness</label><input id="roughness" type="range" min="0" max="1" step=".01"><span class="val" id="roughnessVal"></span></div>
		<div class="row"><label>Clearcoat</label><input id="clearcoat" type="range" min="0" max="1" step=".01"><span class="val" id="clearcoatVal"></span></div>
		<div class="row"><label>Env</label><input id="env" type="range" min="0" max="2" step=".01"><span class="val" id="envVal"></span></div>
		<div class="row"><label>Matcap strength</label><input id="matcapStrength" type="range" min=".2" max="2" step=".01"><span class="val" id="matcapStrengthVal"></span></div>

		<div class="section-title">LIGHT</div>
		<div class="row"><label>Key</label><input id="key" type="range" min="0" max="8" step=".05"><span class="val" id="keyVal"></span></div>
		<div class="row"><label>Blue rim</label><input id="blue" type="range" min="0" max="8" step=".05"><span class="val" id="blueVal"></span></div>
		<div class="row"><label>Pink rim</label><input id="pink" type="range" min="0" max="8" step=".05"><span class="val" id="pinkVal"></span></div>
		<div class="row"><label>Hemi</label><input id="hemi" type="range" min="0" max="5" step=".05"><span class="val" id="hemiVal"></span></div>

		<div class="section-title">EYES</div>
		<div class="row"><label>Top X %</label><input id="topX" type="range" min="0" max="100" step=".1"><span class="val" id="topXVal"></span></div>
		<div class="row"><label>Top Y %</label><input id="topY" type="range" min="0" max="100" step=".1"><span class="val" id="topYVal"></span></div>
		<div class="row"><label>Bottom X %</label><input id="botX" type="range" min="0" max="100" step=".1"><span class="val" id="botXVal"></span></div>
		<div class="row"><label>Bottom Y %</label><input id="botY" type="range" min="0" max="100" step=".1"><span class="val" id="botYVal"></span></div>
		<div class="row"><label>Eye move</label><input id="eyeMove" type="range" min="0" max="18" step=".5"><span class="val" id="eyeMoveVal"></span></div>
		<div class="row"><label>Pupil size</label><input id="pupilSize" type="range" min="5" max="24" step=".5"><span class="val" id="pupilSizeVal"></span></div>
		<div class="row"><label>Pupil squash</label><input id="pupilSquash" type="range" min="0" max=".5" step=".01"><span class="val" id="pupilSquashVal"></span></div>
		<div class="row"><label>Pupil wobble</label><input id="pupilWobble" type="range" min="0" max="12" step=".25"><span class="val" id="pupilWobbleVal"></span></div>
		<div class="row"><label>Highlight</label><input id="highlight" type="range" min="0" max="1" step=".01"><span class="val" id="highlightVal"></span></div>

		<div class="section-title">MOTION</div>
		<div class="row"><label>Float pos</label><input id="floatPos" type="range" min="0" max="12" step=".25"><span class="val" id="floatPosVal"></span></div>
		<div class="row"><label>Float rot</label><input id="floatRot" type="range" min="0" max="15" step=".25"><span class="val" id="floatRotVal"></span></div>
		<div class="row"><label>Speed</label><input id="motionSpeed" type="range" min=".1" max="3" step=".05"><span class="val" id="motionSpeedVal"></span></div>
		<div class="row"><label>Bounce</label><input id="bounce" type="range" min="0" max="12" step=".25"><span class="val" id="bounceVal"></span></div>
		<div class="row"><label>Wobble</label><input id="wobble" type="range" min="0" max="15" step=".25"><span class="val" id="wobbleVal"></span></div>
		<div class="row"><label>Depth</label><input id="depth" type="range" min="0" max="12" step=".25"><span class="val" id="depthVal"></span></div>
		<div class="row"><label>Mouse push</label><input id="mousePush" type="range" min="0" max="20" step=".5"><span class="val" id="mousePushVal"></span></div>
		<div class="row"><label>Mouse radius</label><input id="mouseRadius" type="range" min="30" max="240" step="5"><span class="val" id="mouseRadiusVal"></span></div>
		<div class="row"><label>Chaos</label><input id="chaos" type="range" min="0" max="1.5" step=".05"><span class="val" id="chaosVal"></span></div>
		<div class="row"><label>Ease</label><input id="ease" type="range" min=".01" max=".15" step=".005"><span class="val" id="easeVal"></span></div>

		<div class="check">
			<input id="pauseMotion" type="checkbox">
			<label for="pauseMotion">pause motion</label>
		</div>
	</div>

	<div class="status" id="status">loading…</div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
import { RoomEnvironment } from "https://esm.sh/three@0.180.0/examples/jsm/environments/RoomEnvironment.js";

/* ---------------- DOM ---------------- */
const slot=document.querySelector("#logoSlot");
const topPupil=document.querySelector("#topPupil");
const botPupil=document.querySelector("#botPupil");
const status=document.querySelector("#status");
const modeA=document.querySelector("#modeA");
const modeB=document.querySelector("#modeB");

/* ---------------- THREE ---------------- */
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
slot.prepend(renderer.domElement);

const camera=new THREE.PerspectiveCamera(28,1,.01,100);

const pmrem=new THREE.PMREMGenerator(renderer);
const room=new RoomEnvironment();
const envRT=pmrem.fromScene(room,.04);
room.dispose();
scene.environment=envRT.texture;

const hemi=new THREE.HemisphereLight(0xfff7ec,0x4d4c5f,0);
scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(1.2,3.5,7); scene.add(key);
const blue=new THREE.DirectionalLight(0x7d95ff,.8); blue.position.set(-5,3,-4); scene.add(blue);
const pink=new THREE.DirectionalLight(0xff8fb4,.4); pink.position.set(5,-2,-4); scene.add(pink);

/* ---------------- PROFILES ---------------- */
const profiles={
	A:{
		zoom:1.12, exposure:.55,
		normal:1.0, roughness:.72, clearcoat:0, env:.15, matcapStrength:1,
		key:2.0, blue:.8, pink:.4, hemi:.7,
		topX:78, topY:33, botX:32, botY:62, eyeMove:6, pupilSize:11,
		pupilSquash:.12, pupilWobble:1.5, highlight:.75,
		floatPos:2.25,floatRot:3.25,motionSpeed:.8,bounce:1.25,wobble:2.0,
		depth:1.25,mousePush:3.5,mouseRadius:105,chaos:.18,ease:.045
	},
	B:{
		zoom:1.12, exposure:.85,
		normal:.65, roughness:.5, clearcoat:0, env:0, matcapStrength:1.05,
		key:0, blue:0, pink:0, hemi:0,
		topX:78, topY:33, botX:32, botY:62, eyeMove:6, pupilSize:11,
		pupilSquash:.16, pupilWobble:2.5, highlight:.9,
		floatPos:3.0,floatRot:5.0,motionSpeed:.7,bounce:.8,wobble:3.0,
		depth:1.75,mousePush:4.0,mouseRadius:120,chaos:.28,ease:.04
	}
};
let currentMode="A";
let P=profiles.A;

/* ---------------- STATE ---------------- */
let model=null,baseCameraDistance=1;
const floatObjects=[];
const pbrMaterials=[];
const matcapMaterials=[];
let logoSources=[];

/* ---------------- POINTER ---------------- */
let mouseX=innerWidth/2,mouseY=innerHeight/2;
window.addEventListener("pointermove",e=>{mouseX=e.clientX;mouseY=e.clientY},{passive:true});
window.addEventListener("mousemove",e=>{mouseX=e.clientX;mouseY=e.clientY},{passive:true});

/* ---------------- HELPERS ---------------- */
function get(name){return model?model.getObjectByName(name):null}

function resizeRenderer(){
	const r=slot.getBoundingClientRect();
	renderer.setSize(r.width,r.height,false);
	camera.aspect=r.width/r.height;
	camera.updateProjectionMatrix();
}
function frameModel(object){
	const box=new THREE.Box3().setFromObject(object),center=new THREE.Vector3(),size=new THREE.Vector3();
	box.getCenter(center);box.getSize(size);object.position.sub(center);
	const centered=new THREE.Box3().setFromObject(object);centered.getSize(size);
	const maxDim=Math.max(size.x,size.y,size.z);
	baseCameraDistance=maxDim/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2))*1.08;
	camera.position.set(0,0,baseCameraDistance/P.zoom);
	camera.near=Math.max(.01,baseCameraDistance/100);camera.far=baseCameraDistance*100;camera.updateProjectionMatrix();
}

/* procedural matcap */
function makeMatcapTexture(){
	const c=document.createElement("canvas");
	c.width=c.height=256;
	const ctx=c.getContext("2d");
	const g=ctx.createRadialGradient(84,72,8,128,128,150);
	g.addColorStop(0,"#ffffff");
	g.addColorStop(.16,"#c5c7ff");
	g.addColorStop(.42,"#654cff");
	g.addColorStop(.72,"#2c1cb9");
	g.addColorStop(1,"#0b0750");
	ctx.fillStyle=g;ctx.fillRect(0,0,256,256);

	const g2=ctx.createRadialGradient(210,200,4,210,200,90);
	g2.addColorStop(0,"rgba(255,140,180,.34)");
	g2.addColorStop(1,"rgba(255,140,180,0)");
	ctx.fillStyle=g2;ctx.fillRect(0,0,256,256);

	const tex=new THREE.CanvasTexture(c);
	tex.colorSpace=THREE.SRGBColorSpace;
	return tex;
}
const matcapTex=makeMatcapTexture();

function makePBR(source){
	const m=new THREE.MeshPhysicalMaterial({
		color:source.color?source.color.clone():new THREE.Color(0xffffff),
		map:source.map||null,
		normalMap:source.normalMap||null,
		roughnessMap:source.roughnessMap||null,
		aoMap:source.aoMap||null,
		metalness:0,
		roughness:P.roughness,
		clearcoat:P.clearcoat,
		clearcoatRoughness:.9,
		ior:1.45,
		envMapIntensity:P.env
	});
	if(m.normalMap)m.normalScale.set(P.normal,P.normal);
	pbrMaterials.push(m);
	return m;
}
function makeMatcap(source){
	const m=new THREE.MeshMatcapMaterial({
		color:source.color?source.color.clone():new THREE.Color(0xffffff),
		map:source.map||null,
		matcap:matcapTex,
		normalMap:source.normalMap||null
	});
	if(m.normalMap)m.normalScale.set(P.normal,P.normal);
	matcapMaterials.push(m);
	return m;
}

function setupLogoMaterials(){
	logoSources=[];
	model.traverse(obj=>{
		if(!obj.isMesh||!obj.material)return;
		const source=Array.isArray(obj.material)?obj.material[0]:obj.material;
		if(source.name==="Logo_Master"){
			logoSources.push({obj,source});
		}
	});
	applyModeMaterials();
}
function applyModeMaterials(){
	pbrMaterials.length=0;matcapMaterials.length=0;
	for(const item of logoSources){
		item.obj.material=currentMode==="A"?makePBR(item.source):makeMatcap(item.source);
	}
}

function setupFloatObjects(){
	const names=["B","R","U","N","L","P","E","S","O_TOP_CONTROL","O_BOT_CONTROL"];
	names.forEach((name,index)=>{
		const o=get(name);if(!o)return;
		o.userData.baseP=o.position.clone();
		o.userData.baseR=o.rotation.clone();
		o.userData.phase=index*.79+Math.random()*.55;
		o.userData.speed=.22+Math.random()*.18;
		o.userData.seedA=Math.random()*20;
		o.userData.seedB=Math.random()*20;
		floatObjects.push(o);
	});
}

const tmpWorld=new THREE.Vector3(),tmpNdc=new THREE.Vector3();
function objectScreenPosition(obj){
	obj.getWorldPosition(tmpWorld);tmpNdc.copy(tmpWorld).project(camera);
	const r=slot.getBoundingClientRect();
	return {x:r.left+(tmpNdc.x*.5+.5)*r.width,y:r.top+(-tmpNdc.y*.5+.5)*r.height};
}

/* ---------------- MOTION ---------------- */
function updateMotion(time){
	if(document.querySelector("#pauseMotion").checked)return;
	const rect=slot.getBoundingClientRect();
	const posAmount=(P.floatPos/Math.max(rect.width,1))*1.35;
	const bounceAmount=(P.bounce/Math.max(rect.height,1))*1.65;
	const depthAmount=(P.depth/Math.max(rect.width,1))*2.1;
	const baseRot=THREE.MathUtils.degToRad(P.floatRot);
	const wobbleRot=THREE.MathUtils.degToRad(P.wobble);

	for(const obj of floatObjects){
		const bp=obj.userData.baseP,br=obj.userData.baseR,phase=obj.userData.phase;
		const speed=obj.userData.speed*P.motionSpeed;

		let tx=bp.x+Math.sin(time*speed+phase)*posAmount;
		let tz=bp.z+Math.cos(time*speed*.79+phase*1.2)*posAmount;
		let ty=bp.y+Math.sin(time*speed*.51+phase*.8)*depthAmount;

		tz+=Math.abs(Math.sin(time*speed*1.45+phase))*bounceAmount;
		tx+=Math.sin(time*.31*P.motionSpeed+obj.userData.seedA)*posAmount*P.chaos;
		tz+=Math.cos(time*.27*P.motionSpeed+obj.userData.seedB)*posAmount*P.chaos;

		if(P.mousePush>0){
			const s=objectScreenPosition(obj);
			let dx=s.x-mouseX,dy=s.y-mouseY;
			const dist=Math.hypot(dx,dy)||1;
			if(dist<P.mouseRadius){
				const inf=1-dist/P.mouseRadius;
				dx/=dist;dy/=dist;
				const push=(P.mousePush/Math.max(rect.width,1))*1.9*inf*inf;
				tx+=dx*push;tz-=dy*push;ty+=push*.28;
			}
		}

		obj.position.x+=(tx-obj.position.x)*P.ease;
		obj.position.y+=(ty-obj.position.y)*P.ease*.9;
		obj.position.z+=(tz-obj.position.z)*P.ease;

		const rx=br.x+Math.sin(time*speed*.51+phase)*baseRot+Math.sin(time*speed*.93+phase*.4)*wobbleRot*.35;
		const ry=br.y+Math.cos(time*speed*.46+phase)*baseRot+Math.cos(time*speed*.87+phase*.7)*wobbleRot*.45;
		const rz=br.z+Math.sin(time*speed*.38+phase*1.1)*baseRot*.55+Math.sin(time*speed*1.2+phase)*wobbleRot*.25;

		obj.rotation.x+=(rx-obj.rotation.x)*P.ease*.85;
		obj.rotation.y+=(ry-obj.rotation.y)*P.ease*.85;
		obj.rotation.z+=(rz-obj.rotation.z)*P.ease*.75;
	}
}

/* ---------------- DOM EYES ---------------- */
function updateDOMEye(el,xPct,yPct,time,phase){
	const rect=slot.getBoundingClientRect();
	const baseX=rect.width*(xPct/100),baseY=rect.height*(yPct/100);
	const screenX=rect.left+baseX,screenY=rect.top+baseY;
	let dx=mouseX-screenX,dy=mouseY-screenY;
	const dist=Math.hypot(dx,dy)||1;dx/=dist;dy/=dist;

	const gaze=THREE.MathUtils.clamp(dist/80,0,1);
	const wobX=Math.sin(time*1.4+phase)*P.pupilWobble*.18;
	const wobY=Math.cos(time*1.1+phase)*P.pupilWobble*.18;
	const move=P.eyeMove*gaze;

	el.style.left=(baseX+dx*move+wobX)+"px";
	el.style.top=(baseY+dy*move+wobY)+"px";
	el.style.width=P.pupilSize+"px";el.style.height=P.pupilSize+"px";

	const angle=Math.atan2(dy,dx);
	const sx=1+P.pupilSquash*gaze,sy=1-P.pupilSquash*.55*gaze;
	el.style.transform=`translate(-50%,-50%) rotate(${angle}rad) scale(${sx},${sy})`;

	const morph=50+Math.sin(time*1.6+phase)*5;
	el.style.borderRadius=`${morph}% ${100-morph}% ${morph+3}% ${97-morph}% / ${46+Math.cos(time*1.2+phase)*5}% 56% 44% 54%`;
	el.style.filter=`brightness(${.65+P.highlight*.65})`;
	el.style.opacity=.78+P.highlight*.22;
}

/* ---------------- LOAD ---------------- */
new GLTFLoader().load("./Name1.glb",gltf=>{
	model=gltf.scene;
	model.rotation.x=Math.PI/2;
	scene.add(model);
	setupLogoMaterials();
	setupFloatObjects();
	resizeRenderer();frameModel(model);
	status.textContent="A/B lab ready ✓ • DOM eyes ✓";
},undefined,error=>{
	console.error(error);
	status.textContent="could not load Name1.glb";
});

/* ---------------- UI ---------------- */
const controls=[
	["zoom",2],["exposure",2],["normal",2],["roughness",2],["clearcoat",2],["env",2],["matcapStrength",2],
	["key",2],["blue",2],["pink",2],["hemi",2],
	["topX",1],["topY",1],["botX",1],["botY",1],["eyeMove",1],["pupilSize",1],["pupilSquash",2],["pupilWobble",1],["highlight",2],
	["floatPos",1],["floatRot",1],["motionSpeed",2],["bounce",1],["wobble",1],["depth",1],["mousePush",1],["mouseRadius",0],["chaos",2],["ease",3]
];

let syncing=false;

for(const [id,digits] of controls){
	const input=document.getElementById(id);
	const val=document.getElementById(id+"Val");

	input.addEventListener("input",()=>{
		if(syncing)return;
		const v=parseFloat(input.value);
		P[id]=v;
		val.textContent=v.toFixed(digits);
		applyLiveSettings(id);
	});
}

function syncUI(){
	syncing=true;
	for(const [id,digits] of controls){
		const input=document.getElementById(id),val=document.getElementById(id+"Val");
		input.value=P[id];
		val.textContent=Number(P[id]).toFixed(digits);
	}
	syncing=false;
	applyAllLiveSettings();
}

function applyLiveSettings(id){
	if(id==="zoom"&&model)camera.position.z=baseCameraDistance/P.zoom;
	if(id==="exposure")renderer.toneMappingExposure=P.exposure;

	if(id==="normal"){
		for(const m of [...pbrMaterials,...matcapMaterials])if(m.normalMap)m.normalScale.set(P.normal,P.normal);
	}
	if(id==="roughness")for(const m of pbrMaterials)m.roughness=P.roughness;
	if(id==="clearcoat")for(const m of pbrMaterials)m.clearcoat=P.clearcoat;
	if(id==="env")for(const m of pbrMaterials)m.envMapIntensity=P.env;

	if(id==="key")key.intensity=P.key;
	if(id==="blue")blue.intensity=P.blue;
	if(id==="pink")pink.intensity=P.pink;
	if(id==="hemi")hemi.intensity=P.hemi;
}

function applyAllLiveSettings(){
	renderer.toneMappingExposure=P.exposure;
	key.intensity=P.key;blue.intensity=P.blue;pink.intensity=P.pink;hemi.intensity=P.hemi;
	if(model)camera.position.z=baseCameraDistance/P.zoom;

	for(const m of pbrMaterials){
		m.roughness=P.roughness;m.clearcoat=P.clearcoat;m.envMapIntensity=P.env;
		if(m.normalMap)m.normalScale.set(P.normal,P.normal);
	}
	for(const m of matcapMaterials){
		if(m.normalMap)m.normalScale.set(P.normal,P.normal);
		m.color.multiplyScalar(1); // keeps original baked color
	}
}

function switchMode(mode){
	currentMode=mode;
	P=profiles[mode];

	modeA.classList.toggle("active",mode==="A");
	modeB.classList.toggle("active",mode==="B");

	if(model)applyModeMaterials();
	syncUI();
	status.textContent=`Mode ${mode} active ✓`;
}

modeA.addEventListener("click",()=>switchMode("A"));
modeB.addEventListener("click",()=>switchMode("B"));

syncUI();

/* ---------------- LOOP ---------------- */
const clock=new THREE.Clock();
function animate(){
	requestAnimationFrame(animate);
	const time=clock.getElapsedTime();

	if(model)updateMotion(time);
	updateDOMEye(topPupil,P.topX,P.topY,time,0);
	updateDOMEye(botPupil,P.botX,P.botY,time,1.7);

	renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
	resizeRenderer();
	if(model)frameModel(model);
});
resizeRenderer();

</script>
</body>
</html>
