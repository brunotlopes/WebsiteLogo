<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes 3D Logo</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.status {
		position: absolute;
		left: 14px;
		bottom: 12px;
		font: 11px/1.2 Arial, sans-serif;
		opacity: .28;
		pointer-events: none;
		user-select: none;
	}
</style>
</head>

<body>
<div id="app">
	<div class="status" id="status">loading…</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");
const status = document.querySelector("#status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTING
   ================================================== */

const front = new THREE.DirectionalLight(0xffffff, 3.0);
front.position.set(0, 1.0, 8);
scene.add(front);

const hemi = new THREE.HemisphereLight(
	0xfff5e8,
	0x4d4960,
	1.25
);
scene.add(hemi);

const rimBlue = new THREE.DirectionalLight(0x7895ff, 2.3);
rimBlue.position.set(-5, 3, -5);
scene.add(rimBlue);

const rimPink = new THREE.DirectionalLight(0xff8eb8, 2.0);
rimPink.position.set(5, -2, -5);
scene.add(rimPink);

const cursorLight = new THREE.PointLight(0xffffff, 2.8, 20);
cursorLight.position.set(0, 0, 5);
scene.add(cursorLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2(0, 0);
const smoothPointer = new THREE.Vector2(0, 0);

window.addEventListener("pointermove", (event) => {
	pointer.x = (event.clientX / innerWidth) * 2 - 1;
	pointer.y = -(event.clientY / innerHeight) * 2 + 1;
}, { passive: true });

window.addEventListener("pointerleave", () => {
	pointer.set(0, 0);
});


/* ==================================================
   MODEL
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topPupil = null;
let botPupil = null;

let topWhite = null;
let botWhite = null;

const letters = [];

let logoWidth = 1;
let logoHeight = 1;


/* ==================================================
   HELPERS
   ================================================== */

function get(name) {
	return model ? model.getObjectByName(name) : null;
}

function rememberBase(object) {
	object.userData.basePosition = object.position.clone();
	object.userData.baseRotation = object.rotation.clone();

	object.userData.phase = Math.random() * Math.PI * 2;

	object.userData.repulsion = new THREE.Vector3();
	object.userData.collision = new THREE.Vector3();

	object.userData.rotOffset = new THREE.Vector3();
}

function addLetter(object) {
	if (!object) return;

	rememberBase(object);

	const box = new THREE.Box3().setFromObject(object);
	const size = new THREE.Vector3();
	box.getSize(size);

	object.userData.radius =
		Math.max(size.x, size.y, size.z) * 0.30;

	letters.push(object);
}


/* ==================================================
   FRAME
   ================================================== */

function frameModel() {

	const box = new THREE.Box3().setFromObject(model);

	const center = new THREE.Vector3();
	const size = new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	model.position.sub(center);

	const centered = new THREE.Box3().setFromObject(model);
	centered.getSize(size);

	logoWidth = size.x;
	logoHeight = size.y;

	const maxDim = Math.max(size.x, size.y);

	const fov = THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim / (2 * Math.tan(fov / 2));

	distance *= 1.38;

	camera.position.set(0, 0, distance);
	camera.near = Math.max(.01, distance / 100);
	camera.far = distance * 100;
	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD
   ================================================== */

new GLTFLoader().load(

	"./Name1.glb",

	(gltf) => {

		model = gltf.scene;

		/*
		   Orientation that displayed the logo facing camera.
		*/
		model.rotation.x = Math.PI / 2;

		scene.add(model);

		topControl = get("O_TOP_CONTROL");
		botControl = get("O_BOT_CONTROL");

		topPupil = get("O.Top.Pupil");
		botPupil = get("O.Bot.Pupil");

		topWhite = get("O.Top.White");
		botWhite = get("O.Bot.White");


		[
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		].forEach(name => {
			addLetter(get(name));
		});

		addLetter(topControl);
		addLetter(botControl);

		if (topPupil) rememberBase(topPupil);
		if (botPupil) rememberBase(botPupil);

		frameModel();

		status.textContent =
			`eyes ${topPupil ? "✓" : "✗"} ${botPupil ? "✓" : "✗"} • calm float`;

		console.log("TOP", topControl, topWhite, topPupil);
		console.log("BOT", botControl, botWhite, botPupil);
	},

	undefined,

	(error) => {
		console.error(error);
		status.textContent = "could not load Name1.glb";
	}
);


/* ==================================================
   EYES — GLB LOCAL X/Y
   ================================================== */

/*
   Confirmed directly in Blender for this GLB:
   local X = left/right across the eye
   local Y = up/down across the eye
   local Z = depth

   Therefore we move ONLY local X/Y and preserve Z.
*/

const eyeWorld = new THREE.Vector3();
const eyeScreen = new THREE.Vector3();

function updateEye(pupil, control, white) {
	if (!pupil || !control || !pupil.userData.basePosition) return;

	control.getWorldPosition(eyeWorld);
	eyeScreen.copy(eyeWorld).project(camera);

	let dx = smoothPointer.x - eyeScreen.x;
	let dy = smoothPointer.y - eyeScreen.y;

	// How far from the eye the mouse can be before gaze is fully extended.
	const gazeRange = 0.55;
	dx = THREE.MathUtils.clamp(dx / gazeRange, -1, 1);
	dy = THREE.MathUtils.clamp(dy / gazeRange, -1, 1);

	// Elliptical clamp keeps pupil inside the eye.
	const len = Math.sqrt(dx * dx + dy * dy);
	if (len > 1) {
		dx /= len;
		dy /= len;
	}

	const base = pupil.userData.basePosition;

	// Derive movement from eye size so both eyes behave consistently.
	let maxX = 0.07;
	let maxY = 0.07;

	if (white) {
		const box = new THREE.Box3().setFromObject(white);
		const size = new THREE.Vector3();
		box.getSize(size);
		const radius = Math.max(size.x, size.y, size.z) * 0.16;
		maxX = radius;
		maxY = radius;
	}

	const targetX = base.x + dx * maxX;
	const targetY = base.y + dy * maxY;

	// Smooth gaze, but no spring / overshoot.
	pupil.position.x += (targetX - pupil.position.x) * 0.22;
	pupil.position.y += (targetY - pupil.position.y) * 0.22;

	// Critical: never alter depth.
	pupil.position.z = base.z;
}


/* ==================================================
   CALM ZERO-GRAVITY
   ================================================== */

/*
   No velocity accumulation.
   No spring bounce.

   Each letter gets:
   - slow bounded float
   - temporary mouse repulsion
   - soft collision offsets

   The result stays loose, but does not explode
   across the whole page.
*/

const tempWorld = new THREE.Vector3();
const tempScreen = new THREE.Vector3();

function updateLetters(time) {

	for (const letter of letters) {

		const base =
			letter.userData.basePosition;

		const br =
			letter.userData.baseRotation;

		const phase =
			letter.userData.phase;


		/* --------------------------------------
		   slow space drift
		   -------------------------------------- */

		const driftX =
			Math.sin(
				time * 0.18 + phase
			)
			*
			logoWidth
			*
			0.010;


		const driftZ =
			Math.cos(
				time * 0.15 + phase * 1.2
			)
			*
			logoHeight
			*
			0.012;


		const driftY =
			Math.sin(
				time * 0.13 + phase * .8
			)
			*
			0.018;


		/* --------------------------------------
		   mouse repulsion
		   -------------------------------------- */

		letter.getWorldPosition(tempWorld);

		tempScreen
			.copy(tempWorld)
			.project(camera);


		const dx =
			tempScreen.x -
			smoothPointer.x;

		const dy =
			tempScreen.y -
			smoothPointer.y;


		const distance =
			Math.sqrt(
				dx * dx +
				dy * dy
			);


		const radius =
			0.31;


		let influence =
			THREE.MathUtils.clamp(
				1 -
				distance /
				radius,
				0,
				1
			);


		influence *=
			influence;


		let targetRepX = 0;
		let targetRepZ = 0;
		let targetRepY = 0;


		if (influence > 0) {

			const safe =
				distance || 0.001;


			const dirX =
				dx / safe;


			const dirY =
				dy / safe;


			/*
			   Strong enough to feel like repulsion,
			   but not enough to launch letters.
			*/
			targetRepX =
				dirX *
				influence *
				logoWidth *
				0.025;


			targetRepZ =
				-dirY *
				influence *
				logoHeight *
				0.028;


			targetRepY =
				influence *
				0.030;


			/*
			   More 3D rotation near cursor,
			   but it eases instead of spinning forever.
			*/

			letter.userData.rotOffset.x +=
				(
					dirY *
					influence *
					0.12 -
					letter.userData.rotOffset.x
				)
				* 0.09;


			letter.userData.rotOffset.y +=
				(
					dirX *
					influence *
					0.18 -
					letter.userData.rotOffset.y
				)
				* 0.09;


			letter.userData.rotOffset.z +=
				(
					(dirX - dirY) *
					influence *
					0.08 -
					letter.userData.rotOffset.z
				)
				* 0.08;
		}
		else {

			letter.userData.rotOffset.multiplyScalar(
				0.93
			);
		}


		const rep =
			letter.userData.repulsion;


		rep.x +=
			(
				targetRepX -
				rep.x
			) * 0.10;


		rep.z +=
			(
				targetRepZ -
				rep.z
			) * 0.10;


		rep.y +=
			(
				targetRepY -
				rep.y
			) * 0.08;


		const collision =
			letter.userData.collision;


		const targetX =
			base.x +
			driftX +
			rep.x +
			collision.x;


		const targetZ =
			base.z +
			driftZ +
			rep.z +
			collision.z;


		const targetY =
			base.y +
			driftY +
			rep.y;


		/*
		   Smooth following.
		   No overshoot = no spring feel.
		*/
		letter.position.x +=
			(
				targetX -
				letter.position.x
			) * 0.040;


		letter.position.z +=
			(
				targetZ -
				letter.position.z
			) * 0.040;


		letter.position.y +=
			(
				targetY -
				letter.position.y
			) * 0.035;


		/*
		   collision offsets dissipate calmly
		*/
		collision.multiplyScalar(
			0.88
		);


		/* --------------------------------------
		   subtle 3D float rotation
		   -------------------------------------- */

		const idleRX =
			Math.sin(
				time * .16 +
				phase
			) * .030;


		const idleRY =
			Math.cos(
				time * .14 +
				phase
			) * .038;


		const idleRZ =
			Math.sin(
				time * .12 +
				phase * 1.3
			) * .022;


		const ro =
			letter.userData.rotOffset;


		letter.rotation.x +=
			(
				br.x +
				idleRX +
				ro.x -
				letter.rotation.x
			) * 0.035;


		letter.rotation.y +=
			(
				br.y +
				idleRY +
				ro.y -
				letter.rotation.y
			) * 0.035;


		letter.rotation.z +=
			(
				br.z +
				idleRZ +
				ro.z -
				letter.rotation.z
			) * 0.035;
	}
}


/* ==================================================
   SOFT COLLISIONS
   ================================================== */

function solveCollisions() {

	for (let i = 0; i < letters.length; i++) {

		const a = letters[i];

		for (
			let j = i + 1;
			j < letters.length;
			j++
		) {

			const b = letters[j];


			let dx =
				b.position.x -
				a.position.x;


			let dz =
				b.position.z -
				a.position.z;


			let distance =
				Math.sqrt(
					dx * dx +
					dz * dz
				);


			const minDistance =
				(
					a.userData.radius +
					b.userData.radius
				) * 0.64;


			if (
				distance <
				minDistance
			) {

				if (
					distance <
					0.0001
				) {
					distance =
						0.0001;
				}


				const nx =
					dx /
					distance;


				const nz =
					dz /
					distance;


				const overlap =
					minDistance -
					distance;


				const push =
					overlap *
					0.035;


				a.userData.collision.x -=
					nx *
					push;


				a.userData.collision.z -=
					nz *
					push;


				b.userData.collision.x +=
					nx *
					push;


				b.userData.collision.z +=
					nz *
					push;
			}
		}
	}
}


/* ==================================================
   CURSOR LIGHT
   ================================================== */

function updateCursorLight() {

	cursorLight.position.x +=
		(
			smoothPointer.x *
			4.0 -
			cursorLight.position.x
		) * 0.05;


	cursorLight.position.y +=
		(
			smoothPointer.y *
			2.7 -
			cursorLight.position.y
		) * 0.05;


	cursorLight.position.z =
		5;
}


/* ==================================================
   LOOP
   ================================================== */

const clock =
	new THREE.Clock();


function animate() {

	requestAnimationFrame(
		animate
	);


	const time =
		clock.getElapsedTime();


	smoothPointer.lerp(
		pointer,
		0.12
	);


	if (model) {

		updateLetters(time);

		solveCollisions();
		solveCollisions();


		/*
		   Eye movement is completely independent
		   from letter axis assumptions now.
		*/
		updateEye(
			topPupil,
			topControl,
			topWhite
		);


		updateEye(
			botPupil,
			botControl,
			botWhite
		);
	}


	updateCursorLight();


	renderer.render(
		scene,
		camera
	);
}


animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			innerWidth /
			innerHeight;


		camera.updateProjectionMatrix();


		renderer.setSize(
			innerWidth,
			innerHeight
		);
	}
);

</script>

</body>
</html>
