<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes — 3D Logo Clean Test</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.status {
		position: absolute;
		left: 14px;
		bottom: 12px;
		font: 11px/1.2 Arial, sans-serif;
		opacity: .28;
		pointer-events: none;
		user-select: none;
	}
</style>
</head>

<body>
<div id="app">
	<div class="status" id="status">loading…</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");
const status = document.querySelector("#status");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	28,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({
	antialias: true,
	alpha: false
});

renderer.setPixelRatio(
	Math.min(devicePixelRatio, 2)
);

renderer.setSize(
	innerWidth,
	innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTING
   STATIC + CONTROLLED
   ================================================== */

/*
   No moving lights.
   No animation.
   Just a clean studio setup:
   - soft front light
   - cool back/rim
   - warm back/rim
   - gentle ambient fill
*/

const hemi = new THREE.HemisphereLight(
	0xfff8ef,
	0x4f5060,
	1.5
);
scene.add(hemi);


const front = new THREE.DirectionalLight(
	0xffffff,
	3.8
);
front.position.set(
	0.5,
	2.5,
	7
);
scene.add(front);


const coolRim = new THREE.DirectionalLight(
	0x8ea3ff,
	2.4
);
coolRim.position.set(
	-5,
	3.5,
	-4
);
scene.add(coolRim);


const warmRim = new THREE.DirectionalLight(
	0xff8fb2,
	2.0
);
warmRim.position.set(
	5,
	-2,
	-3
);
scene.add(warmRim);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2(0, 0);
const smoothPointer = new THREE.Vector2(0, 0);

window.addEventListener(
	"pointermove",
	(event) => {

		pointer.x =
			(event.clientX / innerWidth) * 2 - 1;

		pointer.y =
			-(
				(event.clientY / innerHeight) * 2 - 1
			);
	},
	{ passive: true }
);

window.addEventListener(
	"pointerleave",
	() => {
		pointer.set(0, 0);
	}
);


/* ==================================================
   MODEL + EYES
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topOriginalPupil = null;
let botOriginalPupil = null;

let topWhite = null;
let botWhite = null;

let topFakePupil = null;
let botFakePupil = null;

const topEyeData = {};
const botEyeData = {};


/* ==================================================
   HELPERS
   ================================================== */

function get(name) {
	return model
		? model.getObjectByName(name)
		: null;
}


function frameModel(object) {

	const box =
		new THREE.Box3()
			.setFromObject(object);

	const center =
		new THREE.Vector3();

	const size =
		new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	object.position.sub(center);

	const box2 =
		new THREE.Box3()
			.setFromObject(object);

	box2.getSize(size);

	const maxDim =
		Math.max(
			size.x,
			size.y,
			size.z
		);

	const fov =
		THREE.MathUtils.degToRad(
			camera.fov
		);

	let distance =
		maxDim /
		(
			2 *
			Math.tan(
				fov / 2
			)
		);

	/*
	   Slight breathing room.
	*/
	distance *= 1.35;

	camera.position.set(
		0,
		0,
		distance
	);

	camera.near =
		Math.max(
			0.01,
			distance / 100
		);

	camera.far =
		distance * 100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   CREATE A NEW PUPIL IN THREE.JS
   ================================================== */

/*
   We do NOT animate the exported pupil.

   We use the exported pupil only as a placement/size guide,
   hide it, and create a brand-new Three.js pupil.

   This completely removes the transform/hierarchy problem
   from the old prototypes.
*/

function makeFakePupil(
	originalPupil,
	whiteObject,
	eyeData
) {

	if (
		!originalPupil ||
		!whiteObject
	) {
		return null;
	}


	/*
	   Save original pupil world center.
	*/
	const pupilBox =
		new THREE.Box3()
			.setFromObject(originalPupil);

	const pupilSize =
		new THREE.Vector3();

	const pupilCenter =
		new THREE.Vector3();

	pupilBox.getSize(pupilSize);
	pupilBox.getCenter(pupilCenter);


	/*
	   Save white eye world center + size.
	*/
	const whiteBox =
		new THREE.Box3()
			.setFromObject(whiteObject);

	const whiteSize =
		new THREE.Vector3();

	const whiteCenter =
		new THREE.Vector3();

	whiteBox.getSize(whiteSize);
	whiteBox.getCenter(whiteCenter);


	eyeData.baseWorld =
		pupilCenter.clone();

	eyeData.eyeCenterWorld =
		whiteCenter.clone();


	/*
	   Safe movement radius based on white eye size.
	   Conservative on purpose.
	*/
	const eyeDiameter =
		Math.min(
			Math.max(
				whiteSize.x,
				whiteSize.y
			),
			Math.max(
				whiteSize.x,
				whiteSize.z
			)
		);

	eyeData.moveX =
		eyeDiameter * 0.18;

	eyeData.moveY =
		eyeDiameter * 0.18;


	/*
	   Low-poly sphere:
	   enough to read clearly,
	   but still with a slightly faceted 3D feeling.
	*/
	const radius =
		Math.max(
			pupilSize.x,
			pupilSize.y,
			pupilSize.z
		) * 0.48;


	const geometry =
		new THREE.IcosahedronGeometry(
			radius,
			2
		);


	const material =
		new THREE.MeshStandardMaterial({
			color: 0x111111,
			roughness: 0.38,
			metalness: 0.0
		});


	const pupil =
		new THREE.Mesh(
			geometry,
			material
		);


	pupil.position.copy(
		pupilCenter
	);


	scene.add(
		pupil
	);


	/*
	   Hide the exported pupil.
	*/
	originalPupil.visible =
		false;


	return pupil;
}


/* ==================================================
   LOAD
   ================================================== */

new GLTFLoader().load(

	"./Name1.glb",

	(gltf) => {

		model =
			gltf.scene;


		/*
		   This is the orientation that has been
		   showing the logo facing the camera.
		*/
		model.rotation.x =
			Math.PI / 2;


		scene.add(
			model
		);


		topControl =
			get("O_TOP_CONTROL");

		botControl =
			get("O_BOT_CONTROL");

		topOriginalPupil =
			get("O.Top.Pupil");

		botOriginalPupil =
			get("O.Bot.Pupil");

		topWhite =
			get("O.Top.White");

		botWhite =
			get("O.Bot.White");


		/*
		   Frame FIRST so the logo has its final world transform
		   before we read the eye positions.
		*/
		frameModel(
			model
		);


		model.updateMatrixWorld(
			true
		);


		topFakePupil =
			makeFakePupil(
				topOriginalPupil,
				topWhite,
				topEyeData
			);


		botFakePupil =
			makeFakePupil(
				botOriginalPupil,
				botWhite,
				botEyeData
			);


		status.textContent =
			`new pupils ${topFakePupil ? "✓" : "✗"} ${botFakePupil ? "✓" : "✗"} • logo static`;


		console.log(
			"TOP",
			topControl,
			topWhite,
			topOriginalPupil
		);

		console.log(
			"BOT",
			botControl,
			botWhite,
			botOriginalPupil
		);
	},

	undefined,

	(error) => {

		console.error(
			error
		);

		status.textContent =
			"could not load Name1.glb";
	}
);


/* ==================================================
   EYE TRACKING
   ================================================== */

/*
   Because the new pupils live directly in WORLD SPACE,
   tracking is simple and independent from Blender axes.

   We calculate:
   eye position on screen
   -> direction to mouse
   -> move along CAMERA right/up vectors.
*/

const eyeScreen =
	new THREE.Vector3();

const cameraRight =
	new THREE.Vector3();

const cameraUp =
	new THREE.Vector3();

const targetWorld =
	new THREE.Vector3();


function updateFakePupil(
	pupil,
	eyeData
) {

	if (
		!pupil ||
		!eyeData.baseWorld
	) {
		return;
	}


	/*
	   Where is this eye on the screen?
	*/
	eyeScreen
		.copy(
			eyeData.eyeCenterWorld
		)
		.project(
			camera
		);


	let dx =
		smoothPointer.x -
		eyeScreen.x;


	let dy =
		smoothPointer.y -
		eyeScreen.y;


	/*
	   Mouse does not need to be close to the eye.
	   It keeps looking across the page.
	*/
	const gazeRange =
		0.70;


	dx =
		THREE.MathUtils.clamp(
			dx / gazeRange,
			-1,
			1
		);


	dy =
		THREE.MathUtils.clamp(
			dy / gazeRange,
			-1,
			1
		);


	/*
	   Elliptical clamp.
	*/
	const length =
		Math.sqrt(
			dx * dx +
			dy * dy
		);


	if (
		length > 1
	) {

		dx /=
			length;

		dy /=
			length;
	}


	camera.updateMatrixWorld(
		true
	);


	cameraRight
		.setFromMatrixColumn(
			camera.matrixWorld,
			0
		)
		.normalize();


	cameraUp
		.setFromMatrixColumn(
			camera.matrixWorld,
			1
		)
		.normalize();


	targetWorld
		.copy(
			eyeData.baseWorld
		);


	targetWorld
		.addScaledVector(
			cameraRight,
			dx *
			eyeData.moveX
		);


	targetWorld
		.addScaledVector(
			cameraUp,
			dy *
			eyeData.moveY
		);


	/*
	   Simple interpolation.
	   No spring.
	   No overshoot.
	*/
	pupil.position.lerp(
		targetWorld,
		0.24
	);
}


/* ==================================================
   LOOP
   ================================================== */

function animate() {

	requestAnimationFrame(
		animate
	);


	smoothPointer.lerp(
		pointer,
		0.13
	);


	/*
	   NO LETTER ANIMATION.
	   Only eyes.
	*/
	updateFakePupil(
		topFakePupil,
		topEyeData
	);


	updateFakePupil(
		botFakePupil,
		botEyeData
	);


	renderer.render(
		scene,
		camera
	);
}


animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener(
	"resize",
	() => {

		camera.aspect =
			innerWidth /
			innerHeight;


		camera.updateProjectionMatrix();


		renderer.setSize(
			innerWidth,
			innerHeight
		);
	}
);

</script>
</body>
</html>
