<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebsiteLogo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  // ─── SCENE SETUP ───────────────────────────────────────────────
  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // ─── LIGHTING ──────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));

  const dirLight = new THREE.DirectionalLight(0xffffff, 2);
  dirLight.position.set(5, 5, 5);
  scene.add(dirLight);

  // ─── MOUSE TRACKING ────────────────────────────────────────────
  const mouse = new THREE.Vector2(0, 0); // normalizado -1 a 1

  window.addEventListener('mousemove', (e) => {
    mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  });

  // ─── PUPILAS ───────────────────────────────────────────────────
  let pupilBot = null;
  let pupilTop = null;

  // Posições originais salvas após carregar o modelo
  let pupilBotOrigin = null;
  let pupilTopOrigin = null;

  // Limite de deslocamento das pupilas (em unidades do modelo)
  const PUPIL_RANGE = 0.04;

  // ─── CARREGAR GLB ──────────────────────────────────────────────
  const loader = new GLTFLoader();
  loader.load(
    'logo.glb',
    (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // Centralizar e escalar o modelo automaticamente
      const box    = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale  = 3 / maxDim;

      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));

      // Encontrar as pupilas pelo nome
      model.traverse((node) => {
        if (node.isMesh) {
          // Descomente para ver todos os nomes no console:
          // console.log('Mesh:', node.name);

          if (node.name === 'O.Bot.Pupil') {
            pupilBot       = node;
            pupilBotOrigin = node.position.clone();
          }
          if (node.name === 'O.Top.Pupil') {
            pupilTop       = node;
            pupilTopOrigin = node.position.clone();
          }
        }
      });

      if (!pupilBot) console.warn('⚠️ O.Bot.Pupil não encontrada!');
      if (!pupilTop) console.warn('⚠️ O.Top.Pupil não encontrada!');
      if (pupilBot && pupilTop) console.log('✅ Pupilas encontradas com sucesso!');
    },
    (xhr) => {
      console.log(`Carregando: ${(xhr.loaded / xhr.total * 100).toFixed(1)}%`);
    },
    (error) => {
      console.error('Erro ao carregar o GLB:', error);
    }
  );

  // ─── SMOOTH MOUSE (lerp) ────────────────────────────────────────
  // Para um movimento mais suave, usamos interpolação
  const smoothMouse = new THREE.Vector2(0, 0);
  const LERP_SPEED  = 0.08; // 0 = parado, 1 = instantâneo

  // ─── RESIZE ────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ─── LOOP DE ANIMAÇÃO ──────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);

    // Suavizar movimento do mouse
    smoothMouse.lerp(mouse, LERP_SPEED);

    // Mover pupilas
    if (pupilBot && pupilBotOrigin) {
      pupilBot.position.x = pupilBotOrigin.x + smoothMouse.x * PUPIL_RANGE;
      pupilBot.position.y = pupilBotOrigin.y + smoothMouse.y * PUPIL_RANGE;
    }

    if (pupilTop && pupilTopOrigin) {
      pupilTop.position.x = pupilTopOrigin.x + smoothMouse.x * PUPIL_RANGE;
      pupilTop.position.y = pupilTopOrigin.y + smoothMouse.y * PUPIL_RANGE;
    }

    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
