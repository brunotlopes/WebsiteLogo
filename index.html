<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bruno Lopes 3D Logo</title>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #fff4e0;
	}

	#app {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
	}

	canvas {
		display: block;
		width: 100%;
		height: 100%;
	}

	.hint {
		position: absolute;
		left: 16px;
		bottom: 14px;
		font: 12px/1.2 Arial, sans-serif;
		opacity: .35;
		pointer-events: none;
	}
</style>
</head>

<body>
<div id="app">
	<div class="hint">move the mouse • eyes follow • letters repel</div>
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.180.0";
import { GLTFLoader } from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* ==================================================
   SCENE
   ================================================== */

const app = document.querySelector("#app");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4e0);

const camera = new THREE.PerspectiveCamera(
	30,
	innerWidth / innerHeight,
	0.01,
	100
);

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

app.prepend(renderer.domElement);


/* ==================================================
   LIGHTS
   ================================================== */

const front = new THREE.DirectionalLight(0xffffff, 3.3);
front.position.set(0, 1, 8);
scene.add(front);

const hemi = new THREE.HemisphereLight(
	0xfff5e8,
	0x504968,
	1.35
);
scene.add(hemi);

const rimBlue = new THREE.DirectionalLight(0x7895ff, 2.5);
rimBlue.position.set(-5, 3, -5);
scene.add(rimBlue);

const rimPink = new THREE.DirectionalLight(0xff91ba, 2.3);
rimPink.position.set(5, -2, -5);
scene.add(rimPink);

const mouseLight = new THREE.PointLight(0xffffff, 4.5, 20);
mouseLight.position.set(0, 0, 5);
scene.add(mouseLight);


/* ==================================================
   POINTER
   ================================================== */

const pointer = new THREE.Vector2();
const smoothPointer = new THREE.Vector2();

window.addEventListener("pointermove", (event) => {
	pointer.x = (event.clientX / innerWidth) * 2 - 1;
	pointer.y = -(event.clientY / innerHeight) * 2 + 1;
}, { passive: true });

window.addEventListener("pointerleave", () => {
	pointer.set(0, 0);
});


/* ==================================================
   MODEL REFERENCES
   ================================================== */

let model = null;

let topControl = null;
let botControl = null;

let topWhite = null;
let botWhite = null;

let topPupil = null;
let botPupil = null;

const letters = [];

let logoWidth = 1;
let logoHeight = 1;


/* ==================================================
   HELPERS
   ================================================== */

function find(root, name) {
	return root.getObjectByName(name);
}

function rememberBase(object) {

	object.userData.basePosition = object.position.clone();
	object.userData.baseRotation = object.rotation.clone();

	object.userData.velocity = new THREE.Vector3();
	object.userData.angularVelocity = new THREE.Vector3();

	object.userData.phase = Math.random() * Math.PI * 2;
	object.userData.speed = 0.55 + Math.random() * 0.35;
}


/*
   IMPORTANT FIX FOR YOUR GLB:

   I inspected Name1.glb.

   Bottom eye exported as:
   O_BOT_CONTROL
      O.Bot
      O.Bot.White
         O.Bot.Pupil

   Top eye exported as:
   O_TOP_CONTROL
      O.Top
      O.Top.Pupil
         O.Top.White

   So the hierarchy is not symmetrical.

   Here we re-parent White and Pupil directly to their O control,
   while preserving their world transforms.
*/

function normalizeEyeHierarchy(control, white, pupil) {

	if (!control) return;

	if (white) {
		control.attach(white);
	}

	if (pupil) {
		control.attach(pupil);
	}
}


function addLetter(object) {

	if (!object) return;

	rememberBase(object);

	const box = new THREE.Box3().setFromObject(object);
	const size = new THREE.Vector3();

	box.getSize(size);

	/*
	   Collision radius in the visual plane.
	   Slightly smaller than the actual letter size so
	   collisions feel soft instead of rigid.
	*/
	object.userData.radius =
		Math.max(size.x, size.y) * 0.38;

	letters.push(object);
}


/* ==================================================
   FRAME MODEL
   ================================================== */

function frameModel() {

	const box = new THREE.Box3().setFromObject(model);
	const center = new THREE.Vector3();
	const size = new THREE.Vector3();

	box.getCenter(center);
	box.getSize(size);

	model.position.sub(center);

	const box2 = new THREE.Box3().setFromObject(model);
	box2.getSize(size);

	logoWidth = size.x;
	logoHeight = size.y;

	const maxDim = Math.max(size.x, size.y);

	const fov = THREE.MathUtils.degToRad(camera.fov);

	let distance =
		maxDim / (2 * Math.tan(fov / 2));

	distance *= 1.42;

	camera.position.set(0, 0, distance);

	camera.near = Math.max(.01, distance / 100);
	camera.far = distance * 100;

	camera.updateProjectionMatrix();
}


/* ==================================================
   LOAD
   ================================================== */

const loader = new GLTFLoader();

loader.load(
	"./Name1.glb",

	(gltf) => {

		model = gltf.scene;

		/*
		   This is the orientation that displayed the
		   lettering facing the camera in the last version.
		*/
		model.rotation.x = Math.PI / 2;

		scene.add(model);


		topControl = find(model, "O_TOP_CONTROL");
		botControl = find(model, "O_BOT_CONTROL");

		topWhite = find(model, "O.Top.White");
		botWhite = find(model, "O.Bot.White");

		topPupil = find(model, "O.Top.Pupil");
		botPupil = find(model, "O.Bot.Pupil");


		/*
		   FIX EYE HIERARCHY BEFORE STORING BASE POSITIONS.
		*/
		normalizeEyeHierarchy(
			topControl,
			topWhite,
			topPupil
		);

		normalizeEyeHierarchy(
			botControl,
			botWhite,
			botPupil
		);


		[
			"B",
			"R",
			"U",
			"N",
			"L",
			"P",
			"E",
			"S"
		].forEach((name) => {
			addLetter(find(model, name));
		});


		addLetter(topControl);
		addLetter(botControl);


		if (topPupil) rememberBase(topPupil);
		if (botPupil) rememberBase(botPupil);


		frameModel();


		console.log("TOP CONTROL:", topControl);
		console.log("TOP WHITE:", topWhite);
		console.log("TOP PUPIL:", topPupil);

		console.log("BOT CONTROL:", botControl);
		console.log("BOT WHITE:", botWhite);
		console.log("BOT PUPIL:", botPupil);
	},

	undefined,

	(error) => {
		console.error(error);
		document.querySelector(".hint").textContent =
			"Could not load Name1.glb";
	}
);


/* ==================================================
   EYES — REAL CURSOR DIRECTION
   ================================================== */

const projectedEye = new THREE.Vector3();

function updateEye(pupil, control, strength = 1) {

	if (
		!pupil ||
		!control ||
		!pupil.userData.basePosition
	) {
		return;
	}


	/*
	   Find where THIS eye is on screen.
	   Then look from the eye toward the actual cursor.

	   This is much better than simply using global
	   pointer.x / pointer.y.
	*/

	control.getWorldPosition(projectedEye);
	projectedEye.project(camera);

	let dx =
		smoothPointer.x - projectedEye.x;

	let dy =
		smoothPointer.y - projectedEye.y;


	/*
	   0.45 NDC distance = full eye movement.
	*/
	const gazeRange = 0.45;

	dx =
		THREE.MathUtils.clamp(
			dx / gazeRange,
			-1,
			1
		);

	dy =
		THREE.MathUtils.clamp(
			dy / gazeRange,
			-1,
			1
		);


	const len =
		Math.sqrt(dx * dx + dy * dy);

	if (len > 1) {
		dx /= len;
		dy /= len;
	}


	const base = pupil.userData.basePosition;

	const maxX = 0.11;
	const maxZ = 0.085;


	/*
	   The logo root is rotated +90° in X.
	   Local X = screen horizontal.
	   Local Z = inverted screen vertical.
	*/

	const targetX =
		base.x + dx * maxX;

	const targetZ =
		base.z - dy * maxZ;


	pupil.position.x +=
		(targetX - pupil.position.x) * 0.24;

	pupil.position.z +=
		(targetZ - pupil.position.z) * 0.24;


	/*
	   Pressure on the O when the pupil reaches its edge.
	*/

	const pressure =
		THREE.MathUtils.smoothstep(
			Math.sqrt(dx * dx + dy * dy),
			0.68,
			1
		);


	const br = control.userData.baseRotation;

	if (br) {

		const targetRy =
			br.y -
			dx * pressure * 0.12 * strength;

		const targetRx =
			br.x +
			dy * pressure * 0.06 * strength;


		control.rotation.y +=
			(targetRy - control.rotation.y) * 0.09;

		control.rotation.x +=
			(targetRx - control.rotation.x) * 0.09;
	}
}


/* ==================================================
   LETTER MOVEMENT
   ================================================== */

const tempWorld = new THREE.Vector3();
const tempScreen = new THREE.Vector3();

function updateLetterForces(time) {

	for (const letter of letters) {

		const base = letter.userData.basePosition;
		const velocity = letter.userData.velocity;


		/*
		   1. SOFT HOME SPRING

		   Strong enough that it does NOT become a tornado.
		   The logo stretches and breathes, but tends to
		   reform BRUNO LOPES.
		*/

		velocity.x +=
			(base.x - letter.position.x) * 0.018;

		velocity.y +=
			(base.y - letter.position.y) * 0.018;

		velocity.z +=
			(base.z - letter.position.z) * 0.022;


		/*
		   2. SMALL AUTONOMOUS FLOAT

		   No accumulating hurricane.
		*/

		const phase = letter.userData.phase;
		const speed = letter.userData.speed;

		velocity.x +=
			Math.sin(time * speed + phase)
			* 0.00045;

		velocity.z +=
			Math.cos(time * speed * .83 + phase)
			* 0.00055;

		velocity.y +=
			Math.sin(time * speed * .62 + phase)
			* 0.00020;


		/*
		   3. MOUSE REPULSION
		*/

		letter.getWorldPosition(tempWorld);
		tempScreen.copy(tempWorld).project(camera);

		const dx =
			tempScreen.x - smoothPointer.x;

		const dy =
			tempScreen.y - smoothPointer.y;

		const distance =
			Math.sqrt(dx * dx + dy * dy);

		const radius = 0.35;

		let influence =
			THREE.MathUtils.clamp(
				1 - distance / radius,
				0,
				1
			);

		influence *= influence;


		if (influence > 0) {

			const safeLength =
				distance || 0.001;

			const dirX = dx / safeLength;
			const dirY = dy / safeLength;

			const force =
				influence * 0.009;


			velocity.x += dirX * force;

			/*
			   Local Z corresponds to screen vertical
			   after our root rotation.
			*/
			velocity.z -= dirY * force;

			velocity.y +=
				influence * 0.0018;


			/*
			   Strong 3D rotation close to cursor,
			   but damped instead of endlessly spinning.
			*/

			letter.userData.angularVelocity.y +=
				dirX * influence * 0.006;

			letter.userData.angularVelocity.x +=
				dirY * influence * 0.004;

			letter.userData.angularVelocity.z +=
				(dirX - dirY)
				* influence
				* 0.003;
		}
	}
}


/* ==================================================
   LETTER-TO-LETTER COLLISION
   ================================================== */

/*
   Only 10 interactive objects, so simple pairwise
   collision is extremely cheap.

   This is intentionally a SOFT collision, like pieces
   of clay floating in zero gravity.

   They push each other apart instead of passing
   straight through each other.
*/

function solveCollisions() {

	for (let i = 0; i < letters.length; i++) {

		const a = letters[i];

		for (
			let j = i + 1;
			j < letters.length;
			j++
		) {

			const b = letters[j];


			/*
			   Layout plane = local X / Z.
			*/

			let dx =
				b.position.x -
				a.position.x;

			let dz =
				b.position.z -
				a.position.z;

			let distance =
				Math.sqrt(
					dx * dx +
					dz * dz
				);


			const minDistance =
				(
					a.userData.radius +
					b.userData.radius
				)
				* 0.78;


			if (
				distance <
				minDistance
			) {

				if (distance < 0.0001) {
					distance = 0.0001;
					dx = 0.0001;
				}


				const nx = dx / distance;
				const nz = dz / distance;

				const overlap =
					minDistance - distance;


				/*
				   Position correction.
				*/

				const correction =
					overlap * 0.028;


				a.position.x -=
					nx * correction;

				a.position.z -=
					nz * correction;

				b.position.x +=
					nx * correction;

				b.position.z +=
					nz * correction;


				/*
				   Soft collision impulse.
				*/

				const impulse =
					overlap * 0.006;


				a.userData.velocity.x -=
					nx * impulse;

				a.userData.velocity.z -=
					nz * impulse;

				b.userData.velocity.x +=
					nx * impulse;

				b.userData.velocity.z +=
					nz * impulse;


				/*
				   Little rotational bump.
				*/

				a.userData.angularVelocity.y -=
					impulse * 0.7;

				b.userData.angularVelocity.y +=
					impulse * 0.7;
			}
		}
	}
}


/* ==================================================
   INTEGRATE MOVEMENT
   ================================================== */

function integrateLetters() {

	for (const letter of letters) {

		const velocity =
			letter.userData.velocity;

		const av =
			letter.userData.angularVelocity;


		/*
		   High damping = calm floating,
		   not hurricane.
		*/

		velocity.multiplyScalar(0.90);
		av.multiplyScalar(0.88);


		letter.position.add(velocity);


		letter.rotation.x += av.x;
		letter.rotation.y += av.y;
		letter.rotation.z += av.z;


		/*
		   Keep depth reasonably close to original.
		*/

		const base =
			letter.userData.basePosition;

		letter.position.y =
			THREE.MathUtils.clamp(
				letter.position.y,
				base.y - 0.14,
				base.y + 0.14
			);
	}
}


/* ==================================================
   MOUSE LIGHT
   ================================================== */

function updateMouseLight() {

	mouseLight.position.x +=
		(
			smoothPointer.x * 4.5 -
			mouseLight.position.x
		)
		* 0.06;

	mouseLight.position.y +=
		(
			smoothPointer.y * 3 -
			mouseLight.position.y
		)
		* 0.06;

	mouseLight.position.z = 5;
}


/* ==================================================
   LOOP
   ================================================== */

const clock = new THREE.Clock();

function animate() {

	requestAnimationFrame(animate);

	const time = clock.getElapsedTime();

	smoothPointer.lerp(pointer, 0.11);


	if (model) {

		updateLetterForces(time);

		/*
		   Two collision passes make it much more stable
		   without needing a physics engine.
		*/
		solveCollisions();
		solveCollisions();

		integrateLetters();


		/*
		   Eye update AFTER letter movement.
		*/
		updateEye(
			topPupil,
			topControl,
			1
		);

		updateEye(
			botPupil,
			botControl,
			.95
		);
	}


	updateMouseLight();

	renderer.render(scene, camera);
}

animate();


/* ==================================================
   RESIZE
   ================================================== */

window.addEventListener("resize", () => {

	camera.aspect =
		innerWidth / innerHeight;

	camera.updateProjectionMatrix();

	renderer.setSize(
		innerWidth,
		innerHeight
	);
});

</script>
</body>
</html>
